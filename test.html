<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Unit Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; font-weight: bold; }
    h2 { margin-top: 24px; }
  </style>
</head>
<body>
<h1>試し斬りアプリ テスト</h1>
<div id="results"></div>
<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="api.js"></script>
<script src="storage.js"></script>
<script src="courts.js"></script>
<script src="scope.js"></script>
<script src="status.js"></script>
<script src="route.js"></script>
<script src="outbox.js"></script>
<script src="techpicker.js"></script>
<script src="techedit.js"></script>
<script src="admin.js"></script>
<script src="home.js"></script>
<script src="desk.js"></script>
<script src="desk-match.js"></script>
<script src="present.js"></script>
<script src="board.js"></script>
<script src="join.js"></script>
<script>
  var results = document.getElementById('results');
  var passed = 0, failed = 0;

  function assert(desc, actual, expected) {
    var ok = JSON.stringify(actual) === JSON.stringify(expected);
    var el = document.createElement('div');
    el.className = ok ? 'pass' : 'fail';
    el.textContent = (ok ? '✓ ' : '✗ ') + desc +
      (ok ? '' : ' → got: ' + JSON.stringify(actual) + ' expected: ' + JSON.stringify(expected));
    results.appendChild(el);
    ok ? passed++ : failed++;
  }

  async function runApiTests() {
    var h2 = document.createElement('h2');
    h2.textContent = 'api.js';
    results.appendChild(h2);

    // 一巡目を終了すると、サーバーが遷移の中で二巡目を生成する（設計書 2026-09-22）。
    // 生成の結果は応答の round2（created / skipped / finalistCount …）に入る。
    // この補助を通したあとで Api.generateNextRound を呼ぶと、
    // 一巡目が全員採点済みなら reason:'exists'、未採点がいれば reason:'unscored' が返る。
    async function toRound1Done(eventId) {
      await Api.changeStatus(eventId, 'round1');
      return await Api.changeStatus(eventId, 'round1_done');
    }
    // 取り込みで得点が入った行を確定にする。順位・暫定ベスト4 の選考・二巡目生成の判定は
    // 確定した行だけを見る（2026-09-30）ので、9 列 CSV で入れた得点はこれで確定にしてから使う。
    async function confirmScored(eventId) {
      var ps = (await Api.loadEvent(eventId)).players;
      for (var ci = 0; ci < ps.length; ci++) {
        if (Courts.isScored(ps[ci]) && ps[ci].confirmed !== true) {
          await Api.updatePlayer(eventId, ps[ci].id, { confirmed: true });
        }
      }
    }

    // 技術APIテスト
    var techData = await Api.loadTechniques();
    assert('loadTechniques は技術リストを返す', Array.isArray(techData.techniques), true);
    assert('loadTechniques isCustom はbool', typeof techData.isCustom, 'boolean');
    if (techData.isCustom) {
      // カスタム保存済み環境ではデフォルトとの一致は検証できない
      var skip = document.createElement('div');
      skip.textContent = '… カスタム技術が保存されているため、デフォルト一致チェックはスキップ';
      results.appendChild(skip);
    } else {
      // サーバーのデフォルトが data.js と食い違うと採点が0点になるため厳密に比較する。
      // drawn・repeatable・reducedFirst（設計書 2026-09-20-rules-alignment-design.md）も含めて比べる。
      assert('サーバーのデフォルト技術数は data.js と一致', techData.techniques.length, TECHNIQUES.length);
      assert('サーバーのデフォルト技術定義は data.js と一致（drawn・repeatable・reducedFirst を含む）',
        techData.techniques.map(function(t) {
          return { name: t.name, strikes: t.strikes, drawn: t.drawn, repeatable: t.repeatable, reducedFirst: t.reducedFirst };
        }),
        TECHNIQUES);
    }

    // 大会作成テスト
    var result = await Api.saveEvent({ name: 'テスト大会', date: '2025-01-01', venue: 'テスト会場', players: [] });
    assert('saveEvent 成功', result.success, true);
    assert('saveEvent idあり', !!result.id, true);
    var testEventId = result.id;

    // 大会取得テスト
    var loaded = await Api.loadEvent(testEventId);
    assert('loadEvent name', loaded.name, 'テスト大会');
    assert('loadEvent players空', loaded.players.length, 0);

    // 一括登録
    var bulk = await Api.createPlayersBulk(testEventId, {
      court: 'B', isFemale: true, isNewFace: true, names: ['佐藤 花', '', '  ', '鈴木 梅 ', '高橋 桜']
    });
    assert('bulk: 空行を除いた人数を作る', bulk.created, 3);
    assert('bulk: 順番はコート×性別で連番', bulk.players.map(function(p) { return p.order; }), ['B-女子-1-1', 'B-女子-1-2', 'B-女子-1-3']);
    assert('bulk: 名前は trim', bulk.players[1].name, '鈴木 梅');
    assert('bulk: 性別・新人が付く', [bulk.players[0].isFemale, bulk.players[0].isNewFace], [true, true]);
    assert('bulk: 技は空', [bulk.players[0].tech1, bulk.players[0].tech2, bulk.players[0].tech3], ['', '', '']);
    var bulk2 = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: true, isNewFace: false, names: ['田中 藤'] });
    assert('bulk: 既存の続きから採番', bulk2.players[0].order, 'B-女子-1-4');
    var bulkEmptyNames = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: false, names: ['', ' '] });
    assert('bulk: 名前が全部空なら理由を返す', bulkEmptyNames && bulkEmptyNames.error, '登録する名前がありません');
    var bulkBadCourt = await Api.createPlayersBulk(testEventId, { court: 'A-1', isFemale: false, names: ['x'] });
    assert('bulk: 不正なコートは理由を返す', bulkBadCourt && bulkBadCourt.error, '不正なコート名です');
    var bulkNotArray = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: false, names: 'x' });
    assert('bulk: names が配列でなければ理由を返す', bulkNotArray && bulkNotArray.error, '名前の配列が必要です');
    var manyNames = [];
    for (var mi = 0; mi < 501; mi++) manyNames.push('大量' + mi);
    var bulkTooMany = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: false, names: manyNames });
    assert('bulk: 501件は理由を返す', bulkTooMany && bulkTooMany.error, '一度に登録できるのは500名までです');
    var bulkLoaded = await Api.loadEvent(testEventId);
    assert('bulk: 大会に4名入っている', bulkLoaded.players.length, 4);
    await Api.importCsv(testEventId, '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n', 'replace');   // 後続のテストのため空に戻す

    // ---- 一括登録の行形式（設計書 API「一括登録」・テスト 13。PC 運営の「貼り付けて追加」） ----
    // 技名はその大会の「有効な技リスト」で照合されるので、実際の技リストから借りる
    // （サーバーに独自の雛形が保存されている環境でも固定の技名に依存しない）。
    var brEvent = await Api.saveEvent({ name: '行形式テスト', date: '2026-09-19', venue: '', players: [] });
    var brLoaded = await Api.loadEvent(brEvent.id);
    var brTech = brLoaded.techniques[0].name;
    var brTech2 = brLoaded.techniques[1].name;

    var br = await Api.createPlayersBulk(brEvent.id, { rows: [
      { name: '行 一郎', court: 'A', isFemale: false, isNewFace: true, tech1: brTech, tech2: '', tech3: '' },
      { name: ' 行 二郎 ', court: 'A', isFemale: false, isNewFace: false, tech1: brTech, tech2: brTech2, tech3: brTech },
      { name: '行 花子', court: 'B', isFemale: true, isNewFace: false }
    ] });
    assert('bulk rows: 3 行が採番される', br.created, 3);
    assert('bulk rows: コート×性別ごとに採番する',
      br.players.map(function(p) { return p.order; }), ['A-男子-1-1', 'A-男子-1-2', 'B-女子-1-1']);
    assert('bulk rows: 名前は trim する', br.players[1].name, '行 二郎');
    assert('bulk rows: 技はそのまま入る',
      [br.players[1].tech1, br.players[1].tech2, br.players[1].tech3], [brTech, brTech2, brTech]);
    assert('bulk rows: 技を省いた行は空で作る',
      [br.players[2].tech1, br.players[2].tech2, br.players[2].tech3], ['', '', '']);
    assert('bulk rows: 性別・新人は行ごとに付く',
      [br.players[0].isNewFace, br.players[1].isNewFace, br.players[2].isFemale], [true, false, true]);

    var br2 = await Api.createPlayersBulk(brEvent.id, { rows: [{ name: '行 三郎', court: 'A' }] });
    assert('bulk rows: 既存の続きから採番', br2.players[0].order, 'A-男子-1-3');

    var brBadTech = await Api.createPlayersBulk(brEvent.id, { rows: [
      { name: '行 四郎', court: 'A', tech1: brTech },
      { name: '行 五郎', court: 'A', tech1: 'ありえない技' }
    ] });
    assert('bulk rows: 技リストに無い技名は行番号つきの 400',
      brBadTech && brBadTech.error, '2 行目: 技「ありえない技」は技リストにありません');

    // Object.prototype のキー（toString など）を技名として素通ししない（computeRanking と同じ理由）
    var brProtoTech = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 原子郎', court: 'A', tech1: 'toString' }]
    });
    assert('bulk rows: 技名が toString でも技リストに無ければ 400',
      brProtoTech && brProtoTech.error, '1 行目: 技「toString」は技リストにありません');

    // ---- 技名の性別による解決（設計書「技の選択肢を性別で絞る」テスト 4） ----
    // 接尾辞なしの '破図味' は、行の isFemale で courts.js の resolveTechnique と同じ規則
    // （完全一致 → 性別の接尾辞付き）で解決できれば通す。技リストに無い名前は従来どおり断る。
    var brGenderOk = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 性別子', court: 'A', isFemale: true, tech1: '破図味' }]
    });
    assert('bulk rows: 接尾辞なしの技名が isFemale で解決できれば 201', brGenderOk && brGenderOk.created, 1);
    var brGenderBad = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 性別丑', court: 'A', isFemale: true, tech1: '無い技' }]
    });
    assert('bulk rows: 技リストに無い名前は行番号つきの 400',
      brGenderBad && brGenderBad.error, '1 行目: 技「無い技」は技リストにありません');
    // isFemale を省いた行は男子として解決する（resolveTechnique と同じ）。
    var brGenderOmitted = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 性別寅', court: 'A', tech1: '破図味' }]
    });
    assert('bulk rows: isFemale を省いた行は男子として解決して 201', brGenderOmitted && brGenderOmitted.created, 1);

    var brNoName = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 六郎', court: 'A' }, { name: '  ', court: 'A' }]
    });
    assert('bulk rows: 名前が空なら行番号つきの 400', brNoName && brNoName.error, '2 行目: 選手名が必要です');

    var brBadCourt = await Api.createPlayersBulk(brEvent.id, { rows: [{ name: '行 七郎', court: 'A-1' }] });
    assert('bulk rows: 不正なコートは行番号つきの 400', brBadCourt && brBadCourt.error, '1 行目: 不正なコート名です');

    // レビュー修正: row.line（貼り付けプレビューの行番号）があればそれを使う
    // （desk-players.js は ok:false の行を除いて送るため、送信順の何行目かとずれるため）。
    var brWithLine = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 七郎二', court: 'A', line: 5 }, { name: '  ', court: 'A', line: 8 }]
    });
    assert('bulk rows: line があれば行番号つきの 400 にそれを使う',
      brWithLine && brWithLine.error, '8 行目: 選手名が必要です');
    var brBadLine = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '  ', court: 'A', line: 0 }]
    });
    assert('bulk rows: line が正の整数でなければ従来どおり i+1',
      brBadLine && brBadLine.error, '1 行目: 選手名が必要です');
    var brNonIntLine = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '  ', court: 'A', line: '3' }]
    });
    assert('bulk rows: line が数値でなければ従来どおり i+1',
      brNonIntLine && brNonIntLine.error, '1 行目: 選手名が必要です');

    var brNoCourt = await Api.createPlayersBulk(brEvent.id, { rows: [{ name: '行 八郎' }] });
    assert('bulk rows: コートが空でも行番号つきの 400', brNoCourt && brNoCourt.error, '1 行目: 不正なコート名です');

    // isFemale / isNewFace は省略は許すが、真偽値でも undefined でもなければ行番号つきの 400
    var brBadBool = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 九郎', court: 'A' }, { name: '行 十郎', court: 'A', isFemale: 'true' }]
    });
    assert('bulk rows: isFemale が真偽値でも undefined でもなければ 400',
      brBadBool && brBadBool.error, '2 行目: 性別の指定が不正です');
    var brBadBool2 = await Api.createPlayersBulk(brEvent.id, {
      rows: [{ name: '行 十一郎', court: 'A', isNewFace: 1 }]
    });
    assert('bulk rows: isNewFace が真偽値でも undefined でもなければ 400',
      brBadBool2 && brBadBool2.error, '1 行目: 新人の指定が不正です');

    var brEmpty = await Api.createPlayersBulk(brEvent.id, { rows: [] });
    assert('bulk rows: 空の配列は 400', brEmpty && brEmpty.error, '登録する行がありません');

    var brMany = [];
    for (var bri = 0; bri < 501; bri++) brMany.push({ name: '多' + bri, court: 'A' });
    var brTooMany = await Api.createPlayersBulk(brEvent.id, { rows: brMany });
    assert('bulk rows: 501 行は 400', brTooMany && brTooMany.error, '一度に登録できるのは500名までです');

    var brAfter = await Api.loadEvent(brEvent.id);
    assert('bulk rows: 1 行でも不正なら 1 人も登録されない（6名のまま）', brAfter.players.length, 6);
    await Api.deleteEvent(brEvent.id);

    // ==== 選手の追加項目（ゼッケン番号・級位段位・真剣レンタルと形マスタの「抜刀後の形」）====
    // 設計書 2026-09-19-player-extra-fields-design.md トラックA（サーバーと api.js）。
    // 生の fetch で確かめる 400 は Api.createPlayer が 400/404 を null に丸めてしまうため。
    function postPlayerRaw(eventId, body) {
      return fetch('/api/events/' + eventId + '/players', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function(res) {
        return res.json().catch(function() { return null; }).then(function(json) {
          return { status: res.status, json: json };
        });
      });
    }

    // ---- 1. POST /api/events/:id/players の bib/rank/rental ----
    var pfEvent = await Api.saveEvent({ name: '追加項目テスト', date: '2026-09-19', venue: '', players: [] });
    var pfP1 = await Api.createPlayer(pfEvent.id, { name: '追加 一郎', court: 'A', bib: 12 });
    assert('createPlayer: bib が保存される', pfP1.bib, 12);
    var pfP2 = await Api.createPlayer(pfEvent.id, { name: '追加 二郎', court: 'A', bib: 12 });
    assert('createPlayer: 同じ bib は 409 reason:bib',
      [pfP2 && pfP2.reason, pfP2 && pfP2.error],
      ['bib', 'ゼッケン番号 12 は「追加 一郎」が使っています']);

    var pfBibZero = await postPlayerRaw(pfEvent.id, { name: '追加 三郎', court: 'A', bib: 0 });
    assert('createPlayer: bib 0 は 400', [pfBibZero.status, pfBibZero.json.error],
      [400, 'ゼッケン番号は1〜9999の整数で指定してください']);
    var pfBibStr = await postPlayerRaw(pfEvent.id, { name: '追加 三郎', court: 'A', bib: '12' });
    assert('createPlayer: bib が文字列なら 400', pfBibStr.status, 400);
    var pfBibFloat = await postPlayerRaw(pfEvent.id, { name: '追加 三郎', court: 'A', bib: 1.5 });
    assert('createPlayer: bib が小数なら 400', pfBibFloat.status, 400);

    var pfRankLong = await postPlayerRaw(pfEvent.id, { name: '追加 四郎', court: 'A', rank: new Array(22).join('あ') });
    assert('createPlayer: rank 21文字は 400', [pfRankLong.status, pfRankLong.json.error],
      [400, '級位・段位は20文字までの文字列で指定してください']);
    var pfRentalBad = await postPlayerRaw(pfEvent.id, { name: '追加 五郎', court: 'A', rental: 'yes' });
    assert('createPlayer: rental が真偽値でなければ 400', [pfRentalBad.status, pfRentalBad.json.error],
      [400, '真剣レンタルの指定が不正です']);

    var pfOk = await Api.createPlayer(pfEvent.id, { name: '追加 六郎', court: 'A', rank: '初段', rental: true });
    assert('createPlayer: rank/rental が保存される', [pfOk.rank, pfOk.rental], ['初段', true]);
    assert('createPlayer: bib を省略すればキーを持たない', pfOk.bib, undefined);

    // PATCH: bib の重複・null での未設定・型検証
    var pfPatchDup = await Api.updatePlayerInfo(pfEvent.id, pfOk.id, { bib: 12 });
    assert('PATCH: 他の選手の bib と重複すれば 409 reason:bib',
      [pfPatchDup.ok, pfPatchDup.reason, pfPatchDup.error],
      [false, 'bib', 'ゼッケン番号 12 は「追加 一郎」が使っています']);
    var pfPatchSet = await Api.updatePlayerInfo(pfEvent.id, pfOk.id, { bib: 34 });
    assert('PATCH: 空いている bib は保存できる', pfPatchSet.player.bib, 34);
    var pfPatchNull = await Api.updatePlayerInfo(pfEvent.id, pfOk.id, { bib: null });
    assert('PATCH: bib:null で未設定に戻す（キーを持たない）', pfPatchNull.player.bib, undefined);
    var pfPatchBad = await Api.updatePlayerInfo(pfEvent.id, pfOk.id, { bib: 1.5 });
    assert('PATCH: 不正な bib は 400', pfPatchBad.status, 400);
    var pfPatchRankBad = await Api.updatePlayerInfo(pfEvent.id, pfOk.id, { rank: new Array(22).join('あ') });
    assert('PATCH: rank 21文字は 400', pfPatchRankBad.status, 400);
    // 段位の表記の正規化（初段・弐段・参段。ユーザー要望 2026-09-29）
    assert('normalizeRank: 二段・三段（漢数字/半角/全角）は 弐段・参段、他はそのまま',
      ['二段', '三段', '2段', '３段', '初段', '四段', '三級', ' 二段 ', ''].map(EventStatus.normalizeRank),
      ['弐段', '参段', '弐段', '参段', '初段', '四段', '三級', '弐段', '']);
    assert('Courts.rankLabel は EventStatus.normalizeRank と同じ', Courts.rankLabel('三段'), '参段');
    var pfRankNorm = await postPlayerRaw(pfEvent.id, { name: '段位正規化', court: 'A', rank: '三段' });
    assert('createPlayer: rank「三段」は「参段」で保存される', pfRankNorm.json.player.rank, '参段');
    await Api.updatePlayer(pfEvent.id, pfRankNorm.json.player.id, { rank: '二段' });
    var pfRankPatched = (await Api.loadEvent(pfEvent.id)).players.filter(function(p) { return p.id === pfRankNorm.json.player.id; })[0];
    assert('PATCH: rank「二段」は「弐段」で保存される', pfRankPatched.rank, '弐段');
    var pfPatchRentalBad = await Api.updatePlayerInfo(pfEvent.id, pfOk.id, { rental: 'yes' });
    assert('PATCH: rental が真偽値でなければ 400', pfPatchRentalBad.status, 400);
    await Api.deleteEvent(pfEvent.id);

    // ==== 試技順の並べ替え POST /api/events/:id/players/reorder（Api.reorderPlayers）====
    // PC 運営の選手登録の表で行をドラッグしたとき（ユーザー要望 2026-09-30）。
    // 1 つの組（コート×性別×巡目）の行すべての id を新しい順で送ると、番号を 1 から振り直す。
    var roEvent = await Api.saveEvent({ name: '並べ替えテスト', date: '2026-09-30', venue: '', players: [] });
    var roA1 = await Api.createPlayer(roEvent.id, { name: '甲', court: 'A' });
    var roA2 = await Api.createPlayer(roEvent.id, { name: '乙', court: 'A' });
    var roA3 = await Api.createPlayer(roEvent.id, { name: '丙', court: 'A' });
    var roA4 = await Api.createPlayer(roEvent.id, { name: '丁', court: 'A' });
    var roB1 = await Api.createPlayer(roEvent.id, { name: '戊', court: 'B' });
    var roB2 = await Api.createPlayer(roEvent.id, { name: '己', court: 'B' });
    var roF1 = await Api.createPlayer(roEvent.id, { name: '庚', court: 'A', isFemale: true });
    var roF2 = await Api.createPlayer(roEvent.id, { name: '辛', court: 'A', isFemale: true });
    // 欠番（A 男子の 3 番を消す）があっても 1 から詰めて振り直す
    await Api.deletePlayer(roEvent.id, roA3.id, false);
    // 採点済みの行（甲）を含んでも並べ替えは通る
    await Api.updatePlayer(roEvent.id, roA1.id, { score: 30, result: '1', confirmed: true });
    function roOrders(players) {
      var m = {};

    // 途中の行のコートが不正なら何も書き込まない（部分書き込みの回帰テスト）

    var partialCsv = '名前,コート,性別\n' +

    // 技名の前後の空白は落とす（末尾空白があると Scoring.findTechnique の完全一致に掛からず0点になる）

      '空白 太郎,A,男, 四方 ,,,';

    var spacedLoaded = await Api.loadEvent(testEventId);
    assert('簡易CSV: 技名の前後の空白を落とす', spacedLoaded.players[0].tech1, '四方');

    // 拡張15列（エクスポートの往復）
    var fullCsv = '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果,補正点1,補正点2,補正点3,全体補正,備考,確定\n' +
      '拡張 太郎,C-男子-1-1,四方,,,10,,,1    ,2,0,0,-1,メモ,○';

    var fullLoaded = await Api.loadEvent(testEventId);
    assert('拡張CSV: 補正点', fullLoaded.players[0].adjust, [2, 0, 0]);
    assert('拡張CSV: 全体補正・備考・確定', [fullLoaded.players[0].totalAdjust, fullLoaded.players[0].note, fullLoaded.players[0].confirmed], [-1, 'メモ', true]);
    // 直前で score=10 の選手を作っており isScored 判定に引っかかるため、この reset も

    // 大会削除テスト

    // 大会一覧テスト
    var events = await Api.listEvents();
    assert('listEvents は配列', Array.isArray(events), true);

    // ---- 6 / 14. 大会の状態（status）の既定値と読み出し ----
    var stdEvent = await Api.saveEvent({ name: '状態既定テスト', date: '2026-02-01', venue: '', players: [] });
    assert('新規作成の大会は draft', (await Api.loadEvent(stdEvent.id)).status, 'draft');
    // body の status は無視され、既存の値（ここでは draft）が引き継がれる
    await Api.saveEvent({ id: stdEvent.id, name: '状態既定テスト', date: '2026-02-01', venue: '',

    // status を持たないファイル（この機能より前の大会・古い形式のバンドルの取り込み）は
    // 選手から推定する。バンドルは通常 status を含む（全体点検 A-2）ので、status を持たない
    // バンドルを手元で作って確かめる（status キー自体が無い、古いバンドルを模す）。
    var derSrc = await Api.saveEvent({ name: '推定元テスト', date: '2026-02-01', venue: '', players: [] });
    await Api.importCsv(derSrc.id,
      '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' +
      'D1,A-男子-1-1,真,,,30,,,1    \n' +
      'D2,A-男子-1-2,真,,,0,,,\n', 'replace');
    var derBundle = JSON.parse(await Api.exportBundle(derSrc.id));

    var derImported = await Api.importBundle(derBundle);
    assert('status を持たない大会は選手から推定される（一部採点済み → round1）',
      (await Api.loadEvent(derImported.id)).status, 'round1');
    var derList = (await Api.listEvents()).filter(function(e) { return e.id === derImported.id; })[0];
    assert('一覧でも推定値が返る', derList && derList.status, 'round1');
    await Api.deleteEvent(derSrc.id);
    await Api.deleteEvent(derImported.id);

    // POST /api/events は、status を持たない既存大会を保存し直しても status を書かない
    // （書いてしまうと、以後は選手データが変わっても推定し直さず、そのときの推定値に
    // 固定されてしまう）。status を持たないバンドルの取り込みで status 無しの大会を作る
    // 手法を流用し、保存し直した後に選手データを変えて、推定値が動くこと（＝ status が
    // 書かれていないこと）を確かめる。
    var nsSrc = await Api.saveEvent({ name: 'status保存し直しテスト', date: '2026-02-01', venue: '', players: [] });
    await Api.importCsv(nsSrc.id,
      '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' +
      'N1,A-男子-1-1,真,,,30,,,1    \n', 'replace');
    var nsBundle = JSON.parse(await Api.exportBundle(nsSrc.id));
    delete nsBundle.event.status;
    var nsImported = await Api.importBundle(nsBundle);
    assert('status を持たない大会は一部採点済みなら round1 と推定される',
      (await Api.loadEvent(nsImported.id)).status, 'round1');
    // 画面の「保存し直す」動線と同じに、GET の応答（status 込み）をそのまま POST に投げ返す
    await Api.saveEvent(await Api.loadEvent(nsImported.id));
    // 採点データを未採点に戻す。status がファイルに書かれていなければ推定し直して draft に戻るはず
    await Api.importCsv(nsImported.id,
      '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' +
      'N1,A-男子-1-1,真,,,0,,,\n', 'replace', true);
    assert('status の無い大会を保存し直してもファイルに status は付かない（GET は推定し直す）',
      (await Api.loadEvent(nsImported.id)).status, 'draft');
    await Api.deleteEvent(nsSrc.id);
    await Api.deleteEvent(nsImported.id);

    // ---- 7 / 8 / 9. 状態の遷移 API ----
    var stEvent = await Api.saveEvent({ name: '遷移テスト', date: '2026-02-01', venue: '', players: [] });

    var stEmpty = await Api.changeStatus(stEvent.id, 'round1');
    assert('選手0名の draft → round1 は 409 empty',
      [stEmpty.ok, stEmpty.status, stEmpty.reason], [false, 409, 'empty']);
    assert('409 empty は理由の文言を返す', stEmpty.error, '一巡目の選手がいません');

    await Api.createPlayer(stEvent.id, { name: 'S1', court: 'A' });
    var stSkip = await Api.changeStatus(stEvent.id, 'round2');
    assert('draft → round2 は 409 transition',
      [stSkip.ok, stSkip.status, stSkip.reason], [false, 409, 'transition']);
    assert('409 transition は理由の文言を返す', stSkip.error, 'この状態からは進めません');

    var stOk = await Api.changeStatus(stEvent.id, 'round1');
    assert('draft → round1 は通る', [stOk.ok, stOk.status], [true, 'round1']);
    assert('遷移後の GET に新しい status が入る', (await Api.loadEvent(stEvent.id)).status, 'round1');

    var stHist = await Api.loadHistory(stEvent.id);
    var stLast = stHist.entries[stHist.entries.length - 1];
    assert('遷移がサーバー側で履歴に残る', [stLast.action, stLast.detail],
      ['status_change', '準備中 → 一巡目 進行中']);
    assert('遷移の履歴に時刻が付く', typeof stLast.timestamp, 'string');

    // 一巡目終了は未採点でも二巡目を生成する（設計書 2026-09-22。未採点の確認は
    // クライアントが済ませている前提でサーバーは force 扱いにする）。
    var stDone = await Api.changeStatus(stEvent.id, 'round1_done');
    assert('一巡目の終了は未採点でも二巡目を生成する', stDone.round2 && stDone.round2.created, 1);

    var stFinal = await Api.changeStatus(stEvent.id, 'final');
    assert('二巡目なしで round1_done → final に進める', [stFinal.ok, stFinal.status], [true, 'final']);
    var stBack = await Api.changeStatus(stEvent.id, 'round1_done');
    assert('final から round1_done に戻せる（二巡目が無いとき）',
      [stBack.ok, stBack.status], [true, 'round1_done']);

    var stBad = await Api.changeStatus(stEvent.id, 'nosuchstate');
    assert('STATES に無い状態は 400', [stBad.ok, stBad.status], [false, 400]);
    assert('存在しない大会の遷移は 404', (await Api.changeStatus('nosuchevent', 'round1')).status, 404);
    await Api.deleteEvent(stEvent.id);

    // no_round2 の拒否は「round2 の行が無いまま round1_done を持つ大会」だけに残る
    // （通常の遷移では round1_done が必ず二巡目を作るので、この経路は既存データの
    // 移行のためだけに残る。バンドル取り込みで status を直接 round1_done にして再現する）。
    var noR2Src = await Api.saveEvent({ name: 'no_round2テスト', date: '2026-02-01', venue: '', players: [] });
    await Api.createPlayer(noR2Src.id, { name: 'S1', court: 'A' });
    var noR2Bundle = JSON.parse(await Api.exportBundle(noR2Src.id));
    noR2Bundle.event.status = 'round1_done';
    var noR2Imported = await Api.importBundle(noR2Bundle);
    var stNoR2 = await Api.changeStatus(noR2Imported.id, 'round2');
    assert('二巡目が0件なら round1_done → round2 は 409 no_round2',
      [stNoR2.ok, stNoR2.status, stNoR2.reason], [false, 409, 'no_round2']);
    assert('409 no_round2 は理由の文言を返す', stNoR2.error, '二巡目が生成されていません');
    await Api.deleteEvent(noR2Src.id);
    await Api.deleteEvent(noR2Imported.id);

    // ---- 10. ロックガード（final / archived は書き込めない） ----
    // Api の関数はステータスコードを丸めるものがあるので、ここは直接 fetch して
    // 「409 かつ reason: locked」を確かめる。
    async function writeResult(url, method, body) {
      var res = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      var json = null;
      try { json = await res.json(); } catch (e) { /* 本文が JSON でなくてもよい */ }
      return { status: res.status, reason: (json && json.reason) || '' };
    }

    var lockEvent = await Api.saveEvent({ name: 'ロックテスト', date: '2026-02-01', venue: '', players: [] });
    await Api.importCsv(lockEvent.id,
      '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' +
      'L1,A-男子-1-1,真,,,30,,,1    \n' +
      'L2,A-男子-1-2,真,,,10,,,1    \n', 'replace');
    await Api.changeStatus(lockEvent.id, 'round1');
    await Api.changeStatus(lockEvent.id, 'round1_done');   // 遷移が二巡目を生成する
    await Api.changeStatus(lockEvent.id, 'round2');
    // L1・L2 は男子2名とも得点があり4名未満なので両方が決戦（暫定ベスト4）に入る。
    // 決戦の行がある大会は round2 → round2_done の前に round2_final を挟む必要がある。
    await Api.changeStatus(lockEvent.id, 'round2_final');
    await Api.changeStatus(lockEvent.id, 'round2_done');
    assert('round2_done → final に進める',
      (await Api.changeStatus(lockEvent.id, 'final')).status, 'final');

    var lockP = (await Api.loadEvent(lockEvent.id)).players[0];
    var lockBase = '/api/events/' + lockEvent.id;
    assert('確定後の大会上書きは 409 locked',
      await writeResult('/api/events', 'POST', { id: lockEvent.id, name: 'ロックテスト', players: [] }),
      { status: 409, reason: 'locked' });
    assert('確定後の選手追加は 409 locked',
      await writeResult(lockBase + '/players', 'POST', { name: 'L3', court: 'A' }),
      { status: 409, reason: 'locked' });
    assert('確定後の一括登録は 409 locked',
      await writeResult(lockBase + '/players/bulk', 'POST', { court: 'A', names: ['L3'] }),
      { status: 409, reason: 'locked' });
    var lockCountBefore = (await Api.loadEvent(lockEvent.id)).players.length;
    assert('確定後の一括登録（行形式）も 409 locked',
      await writeResult(lockBase + '/players/bulk', 'POST', { rows: [{ name: 'L3', court: 'A' }] }),
      { status: 409, reason: 'locked' });
    assert('確定後の一括登録（行形式）は 1 人も増やさない',
      (await Api.loadEvent(lockEvent.id)).players.length, lockCountBefore);
    assert('確定後の PATCH は 409 locked',
      await writeResult(lockBase + '/players/' + lockP.id, 'PATCH', { name: 'X' }),
      { status: 409, reason: 'locked' });
    assert('確定後の PATCH /api/events/:id（基本情報）は 409 locked',
      await writeResult(lockBase, 'PATCH', { name: 'X' }),
      { status: 409, reason: 'locked' });
    assert('確定後の選手削除は 409 locked',
      await writeResult(lockBase + '/players/' + lockP.id + '?force=1', 'DELETE'),
      { status: 409, reason: 'locked' });
    assert('確定後の CSV 取り込みは 409 locked',
      await writeResult(lockBase + '/import', 'POST', { csvText: '選手名\n', mode: 'append' }),
      { status: 409, reason: 'locked' });
    assert('確定後の技の PUT は 409 locked',
      await writeResult(lockBase + '/techniques', 'PUT',
        { techniques: [{ name: '真', strikes: [1, null, null, null] }] }),
      { status: 409, reason: 'locked' });
    assert('確定後の技の DELETE は 409 locked',
      await writeResult(lockBase + '/techniques', 'DELETE'),
      { status: 409, reason: 'locked' });
    assert('確定後の二巡目生成は 409 locked',
      await writeResult(lockBase + '/rounds/2/generate', 'POST', { force: true }),
      { status: 409, reason: 'locked' });
    assert('確定後の putLive は 409 locked',
      await writeResult(lockBase + '/live/A', 'PUT', { playerId: lockP.id }),
      { status: 409, reason: 'locked' });
    var lockRound1Ids = (await Api.loadEvent(lockEvent.id)).players
      .filter(function(p) { return /^A-男子-1-/.test(p.order); })
      .map(function(p) { return p.id; });
    assert('確定後の試技順の並べ替えは 409 locked',
      await writeResult(lockBase + '/players/reorder', 'POST',
        { court: 'A', isFemale: false, round: 1, ids: lockRound1Ids.slice().reverse() }),
      { status: 409, reason: 'locked' });

    // Api の各関数も（changeStatus と同じ作法で）409 の reason と error をそのまま返す。
    // 呼び出し側（admin-players.js / admin-round.js）はこの reason:'locked' を見て
    // 「戻す」を案内する（採点済みガードの 409 と取り違えない）。
    var apiDelLocked = await Api.deletePlayer(lockEvent.id, lockP.id, false);
    assert('確定後の Api.deletePlayer は reason:locked を返す',
      [apiDelLocked.blocked, apiDelLocked.reason], [true, 'locked']);
    assert('確定後の Api.deletePlayer はエラー文言も返す', typeof apiDelLocked.error, 'string');

    var apiImportLocked = await Api.importCsv(lockEvent.id, '選手名\n', 'append');
    assert('確定後の Api.importCsv は reason:locked を返す',
      [apiImportLocked.blocked, apiImportLocked.reason], [true, 'locked']);
    assert('確定後の Api.importCsv はエラー文言も返す', typeof apiImportLocked.error, 'string');

    var apiGenLocked = await Api.generateNextRound(lockEvent.id, true);
    assert('確定後の Api.generateNextRound は reason:locked を返す',
      [apiGenLocked.blocked, apiGenLocked.reason], [true, 'locked']);
    assert('確定後の Api.generateNextRound はエラー文言も返す', typeof apiGenLocked.error, 'string');

    var apiPatchLocked = await Api.updatePlayerInfo(lockEvent.id, lockP.id, { name: 'X' });
    assert('確定後の Api.updatePlayerInfo は reason:locked を返す',
      [apiPatchLocked.ok, apiPatchLocked.status, apiPatchLocked.reason], [false, 409, 'locked']);
    assert('確定後の Api.updatePlayerInfo はエラー文言も返す', typeof apiPatchLocked.error, 'string');

    var apiCreateLocked = await Api.createPlayer(lockEvent.id, { name: 'L3', court: 'A' });
    assert('確定後の Api.createPlayer は reason:locked を返す',
      [apiCreateLocked.player, apiCreateLocked.reason], [null, 'locked']);
    assert('確定後の Api.createPlayer はエラー文言も返す', typeof apiCreateLocked.error, 'string');

    // 拒まない経路
    assert('確定後も GET は読める', (await Api.loadEvent(lockEvent.id)).status, 'final');
    assert('確定後も共有リンクは発行できる',
      !!(await Api.createShareLink(lockEvent.id)).token, true);

    // 戻すと編集できる
    var lockBack = await Api.changeStatus(lockEvent.id, 'round2_done');
    assert('final から round2_done に戻せる（二巡目があるとき）',
      [lockBack.ok, lockBack.status], [true, 'round2_done']);
    assert('戻したあとは PATCH が通る',
      (await Api.updatePlayerInfo(lockEvent.id, lockP.id, { name: 'L1改' })).ok, true);

    // アーカイブも同じく書けない
    await Api.changeStatus(lockEvent.id, 'final');
    await Api.changeStatus(lockEvent.id, 'archived');
    assert('アーカイブ中の PATCH は 409 locked',
      await writeResult(lockBase + '/players/' + lockP.id, 'PATCH', { name: 'Y' }),
      { status: 409, reason: 'locked' });
    assert('アーカイブから final に戻せる',
      (await Api.changeStatus(lockEvent.id, 'final')).status, 'final');
    assert('確定済みでも大会そのものは削除できる', await Api.deleteEvent(lockEvent.id), true);

    // ---- 基本情報の更新 PATCH /api/events/:id（Api.updateEventInfo） ----
    // 大会ファイルを丸ごと送り直す saveEvent と違い、name / date / venue だけを書き換える。
    var uiEvent = await Api.saveEvent({ name: '基本情報更新テスト', date: '2026-04-01', venue: '元の会場', players: [] });
    await Api.createPlayer(uiEvent.id, { name: 'U1', court: 'A' });
    var uiBefore = await Api.loadEvent(uiEvent.id);
    var uiRes = await Api.updateEventInfo(uiEvent.id, { name: '基本情報更新テスト改', date: '2026-04-02', venue: '新しい会場' });
    assert('updateEventInfo は成功する', uiRes && uiRes.ok, true);
    var uiAfter = await Api.loadEvent(uiEvent.id);
    assert('updateEventInfo で name/date/venue が変わる',
      [uiAfter.name, uiAfter.date, uiAfter.venue],
      ['基本情報更新テスト改', '2026-04-02', '新しい会場']);
    assert('updateEventInfo は players に触れない', uiAfter.players, uiBefore.players);
    assert('updateEventInfo は techniques に触れない（内容が一致）', uiAfter.techniques, uiBefore.techniques);
    assert('updateEventInfo は techniquesSource を変えない', uiAfter.techniquesSource, uiBefore.techniquesSource);

    var uiEmpty = await Api.updateEventInfo(uiEvent.id, { name: '   ' });
    assert('name が空文字の updateEventInfo は 400', [uiEmpty.ok, uiEmpty.status], [false, 400]);
    assert('大会名は変わらない（400 で拒否）',
      (await Api.loadEvent(uiEvent.id)).name, '基本情報更新テスト改');

    var uiNoName = await Api.updateEventInfo(uiEvent.id, { venue: '会場だけ更新' });

    // 一巡目の得点が低い順に置く（設計書 2026-09-28。決戦コートは廃止）。
    async function makeGenEvent(name, csv) {
      var ev = await Api.saveEvent({ name: name, date: '2026-09-22', venue: '', players: [] });
      await Api.importCsv(ev.id, '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' + csv, 'replace');

      b8Csv += 'M' + (i + 1) + ',A-男子-1-' + (i + 1) + ',真,水月,四方,' + s + ',,,1    \n';
    });
    b8Csv += 'F1,A-女子-1-1,真,水月,四方,99,,○,1    \n';
    b8Csv += 'F2,A-女子-1-2,真,水月,四方,90,,○,1    \n';
    var b8 = await makeGenEvent('決戦4名', b8Csv);
    await toRound1Done(b8.id);

    var b8Rows = round2Of((await Api.loadEvent(b8.id)).players);
    var b8Fin = b8Rows.filter(function(p) { return p.finalist === true; });
    assert('決戦の人数の定数は 4', EventStatus.FINALIST_COUNT, 4);
    assert('決戦は一般男子の上位4名', b8Fin.map(function(p) { return p.name; }).sort(),
      ['M1', 'M2', 'M3', 'M4']);
    assert('決戦の order は先頭コート・男子・二巡目で、通常の行の続き番号・得点の低い順',
      b8Fin.slice().sort(Courts.compareOrder).map(function(p) { return p.order + ':' + p.name; }),
      ['A-男子-2-7:M4', 'A-男子-2-8:M3', 'A-男子-2-9:M2', 'A-男子-2-10:M1']);
    assert('二巡目の行の並び（データ順）でも候補は通常の行の後ろ',
      b8Rows.map(function(p) { return p.name; }),
      ['F2', 'F1', 'M10', 'M9', 'M8', 'M7', 'M6', 'M5', 'M4', 'M3', 'M2', 'M1']);
    assert('決戦に入らない男子は元のコートに残る',
      b8Rows.filter(function(p) { return p.name === 'M9' || p.name === 'M10'; })

      [undefined, undefined]);
    assert('決戦の行は男子として作られる',
      b8Fin.every(function(p) { return p.isFemale === false; }), true);
    assert('二巡目の技は一巡目の複製',
      [b8Rows[0].tech1, b8Rows[0].tech2, b8Rows[0].tech3], ['真', '水月', '四方']);

    [60, 55, 50, 45, 45, 40, 35, 30, 25, 20].forEach(function(s, i) {
      tieCsv += 'T' + (i + 1) + ',A-男子-1-' + (i + 1) + ',真,水月,四方,' + s + ',,,1    \n';
    });
    var tie = await makeGenEvent('決戦同点', tieCsv);
    await toRound1Done(tie.id);
    await Api.generateNextRound(tie.id, true);
    var tieFin = round2Of((await Api.loadEvent(tie.id)).players)

    assert('4位が同点なら5名が決戦に入る', tieFin.length, 5);
    // T4・T5 が同点（45点）で4位タイ。5名（T1〜T5）が決戦に入り、T6（40点）は入らない。
    // 決戦の並びは一巡目の得点が低い順・同点は order 順（T4 が 'A-男子-1-4' で T5 より先）。

    async function au(url, method, body) {

        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      var json = null;
      try { json = await res.json(); } catch (e) { /* 本文が JSON でなくてもよい */ }
      return { status: res.status, json: json || {} };
    }
    function auPatch(eventId, playerId, body) {

    }

    // ---- splitDelimited（RFC4180 の引用符の規則で 1 行を分割。server/index.js の parseCSV と同じ規則） ----
    assert('splitDelimited: 引用符内のカンマは区切らない',
      Courts.splitDelimited('a,"b,c",d', ','), { fields: ['a', 'b,c', 'd'], error: '' });
    assert('splitDelimited: "" は " 1 文字にする',

    assert('splitDelimited: 閉じていない引用符は理由を返す',

    assert('splitDelimited: タブ区切りにも使える',
      Courts.splitDelimited('a\t"b\tc"\td', '\t'), { fields: ['a', 'b\tc', 'd'], error: '' });

    // ---- parsePasteRows の引用符付き CSV（カンマ区切りのときだけ RFC4180 で切る） ----
    assert('parsePasteRows: 引用符付きのカンマは名前の一部として扱う',
      pBrief('"庚, 七郎",B,,,,,'),

    assert('parsePasteRows: "" のエスケープを名前で読む',

      [[false, '引用符が閉じていません']]);
    // 裸の " はタブ区切りでもカンマ区切りと同じ規則で断る（列がずれて黙って登録されるより安全）

    assert('parsePasteRows: タブ区切りでも Excel の引用符付きセルを 1 列として読む',
      pBrief('"山田\t太郎"\tA\t\t\t\t\t'),

    // parsePasteRows: 10列（名前,コート,性別,新人,技1,技2,技3,ゼッケン,級位段位,レンタル）
    function pRows10(text, techniques, defaults) { return Courts.parsePasteRows(text, techniques || pTech, defaults).rows; }
    function pBrief10(text, techniques, defaults) {
      return pRows10(text, techniques, defaults).map(function(r) {
        return [r.line, r.name, r.court, r.isFemale, r.isNewFace, r.techs.join('/'), r.bib, r.rank, r.rental, r.ok, r.error].join('|');
      });
    }
    assert('parsePasteRows: 8〜10列目のゼッケン・級位段位・レンタルを読む',
      pBrief10('山田 太郎,A,男子,,,,,12,初段,レンタル'),
      ['1|山田 太郎|A|false|false|//|12|初段|true|true|']);
    assert('parsePasteRows: 7列だけの行は従来どおり（bib=null, rank=\'\', rental=false）',
      pBrief10('山田,A,男子,新人,四方,水月,'),
      ['1|山田|A|false|true|四方/水月/|||false|true|']);
    assert('parsePasteRows: ゼッケン・級位段位・レンタルの列が無い行は未設定',
      pRows10('山田,A').map(function(r) { return [r.bib, r.rank, r.rental, r.ok]; }),
      [[null, '', false, true]]);
    assert('parsePasteRows: ゼッケンは整数に変換する（先頭の0も含めて）',
      pRows10('山田,A,,,,,,007,,').map(function(r) { return r.bib; }), [7]);
    assert('parsePasteRows: ゼッケンが数字以外なら ok:false',
      pRows10('山田,A,,,,,,12a,,').map(function(r) { return [r.bib, r.ok, r.error]; }),
      [[null, false, 'ゼッケン番号は 1〜9999 の整数で']]);
    assert('parsePasteRows: ゼッケンが小数なら ok:false',
      pRows10('山田,A,,,,,,1.5,,').map(function(r) { return [r.ok, r.error]; }),

      [fromServer2[0].adjust, fromServer2[0].totalAdjust, fromServer2[0].note, fromServer2[0].confirmed],

    assert('applyPending 旧形式のエントリは新項目に触らない',
      [fromServer2[1].adjust, fromServer2[1].totalAdjust, fromServer2[1].note, fromServer2[1].confirmed],
      [[9, 9, 9], 9, '既存', true]);

    localStorage.setItem('tmg_outbox', JSON.stringify([
      { eventId: 'ev1', playerId: 'p3', note: '備考だけ', queuedAt: 't6' }
    ]));
    Outbox.init(function() {}, function() {});
    await new Promise(function(r) { setTimeout(r, 400); });
    var fromServer3 = [{ id: 'p3', score: 42, result: 'Z', note: '' }];
    Outbox.applyPending('ev1', fromServer3);
    assert('applyPending 備考だけのエントリは得点と結果に触らない',
      [fromServer3[0].score, fromServer3[0].result, fromServer3[0].note], [42, 'Z', '備考だけ']);

    // 後始末: 本物のキューの内容とメモリ上の状態を元に戻す
    Api.updatePlayer = origUpdate;
    if (savedOutbox === null) localStorage.removeItem('tmg_outbox');
    else localStorage.setItem('tmg_outbox', savedOutbox);
    Outbox.init(function() {}, function() {});

    // present.js（発表モードで開く順）
    var h2p = document.createElement('h2');
    h2p.textContent = 'present.js';
    results.appendChild(h2p);

    assert('revealOrder: 空配列は空', Present.revealOrder([]), []);
    assert('revealOrder: null でも落ちない', Present.revealOrder(null), []);
    assert('revealOrder: 1件は [0]', Present.revealOrder([{ rank: 1, name: 'A', score: 1 }]), [0]);
    var revRows = [
      { rank: 1, name: 'A', score: 74 },
      { rank: 1, name: 'B', score: 74 },
      { rank: 3, name: 'C', score: 62 }
    ];
    assert('revealOrder: 下位から順に開く', Present.revealOrder(revRows), [2, 1, 0]);
    assert('revealOrder: 同順位もまとめず1人ずつ', Present.revealOrder(revRows).length, revRows.length);
    assert('revealOrder: 最後に開くのは1位の行',
      revRows[Present.revealOrder(revRows)[revRows.length - 1]].rank, 1);

    // ---- 発表モードのベスト4（以前の「決戦」モードを置き換えた。設計書 2026-10-04-finale-after-round2 4 章） ----
    assert('Present.best4Rows: best4 があれば rows を並びのまま返す',
      Present.best4Rows({ best4: { rows: [{ name: 'A', rank: 1 }, { name: 'B', rank: 2 }] } })
        .map(function(r) { return r.name; }), ['A', 'B']);
    assert('Present.best4Rows: best4 が無ければ空', Present.best4Rows({ rankings: {} }), []);
    assert('Present.best4Rows: data が null でも空', Present.best4Rows(null), []);
    function b4Ranks(ranks) { return ranks.map(function(k, i) { return { name: 'P' + i, rank: k }; }); }
    assert('Present.best4Groups: 4 位から 1 人ずつ（添字の組を下位から）',
      Present.best4Groups(b4Ranks([1, 2, 3, 4])), [[3], [2], [1], [0]]);
    assert('Present.best4Groups: 同順位は 1 組にまとめて同時に出す（3 位タイ）',
      Present.best4Groups(b4Ranks([1, 2, 3, 3])), [[2, 3], [1], [0]]);
    assert('Present.best4Groups: 1 位タイ（1, 1, 3）',
      Present.best4Groups(b4Ranks([1, 1, 3])), [[2], [0, 1]]);
    assert('Present.best4Groups: 空配列・null は空',
      [Present.best4Groups([]), Present.best4Groups(null)], [[], []]);
    assert('Present.defaultMode: 最終組 進行中でも board（自動で切り替えない）',
      Present.defaultMode({ finale: { status: 'round2_final', rows: [{ name: 'A' }] } }), 'board');
    assert('Present.defaultMode: 最終組 進行中でなければ board',
      Present.defaultMode({ finale: { status: 'round2', rows: [{ name: 'A' }] } }), 'board');
    assert('Present.defaultMode: finale が無ければ board', Present.defaultMode({}), 'board');

    // board.js テスト（配信用ボードの純粋関数。DOM には触らない）
    var h2b = document.createElement('h2');
    h2b.textContent = 'board.js';
    results.appendChild(h2b);

    var tBase = '2026-10-11T01:00:00.000Z';
    assert('remaining: 止まっていれば sec のまま',
      Board.remaining({ sec: 300, running: false }, tBase, '2026-10-11T01:02:00.000Z'), 300);
    assert('remaining: 動いていれば経過を引く',
      Board.remaining({ sec: 300, running: true }, tBase, '2026-10-11T01:00:42.000Z'), 258);
    assert('remaining: 0 で止まる（マイナスにしない）',
      Board.remaining({ sec: 10, running: true }, tBase, '2026-10-11T01:05:00.000Z'), 0);
    assert('remaining: 端末の時計が進んでいても経過は0以上',
      Board.remaining({ sec: 300, running: true }, tBase, '2026-10-11T00:59:00.000Z'), 300);
    assert('remaining: 時刻が読めなければ sec のまま',
      Board.remaining({ sec: 120, running: true }, '', 'x'), 120);
    assert('remaining: タイマーが無ければ 0', Board.remaining(null, tBase, tBase), 0);

    var boardPlayer = {
      tech1: '真', tech2: '', tech3: '連',
      result: '11   10   ', adjust: [3, 1, 0], isFemale: false
    };
    assert('rowsFor: 空の枠を詰めて技名を並べる',
      Board.rowsFor(boardPlayer).map(function(r) { return r.techName; }), ['真', '連']);
    assert('rowsFor: 太刀の値を result から読む',
      Board.rowsFor(boardPlayer).map(function(r) { return r.values; }),
      [['○', '○', '', ''], ['○', '×', '', '']]);
    assert('rowsFor: 補正点は詰めた行の添字で添える',
      Board.rowsFor(boardPlayer).map(function(r) { return r.adjust; }), [3, 1]);
    assert('rowsFor: adjust が無ければ5文字目を補正点3として読む（旧データ）',
      Board.rowsFor({ tech1: '真', result: '11  1' }).map(function(r) { return r.adjust; }), [3]);
    assert('rowsFor: 技が無ければ空', Board.rowsFor({ result: '' }), []);
    assert('rowsFor: 選手が null でも落ちない', Board.rowsFor(null), []);
    assert('rowsFor: result が短くても未として読む',
      Board.rowsFor({ tech1: '真', result: '' })[0].values, ['', '', '', '']);

    assert('parseHash: トークンとコートに分ける',
      Board.parseHash('#O7KVvuj-/A'), { token: 'O7KVvuj-', court: 'A' });
    assert('parseHash: コート省略なら空',
      Board.parseHash('#O7KVvuj-'), { token: 'O7KVvuj-', court: '' });
    assert('parseHash: ハッシュが空なら両方とも空',
      Board.parseHash(''), { token: '', court: '' });
    assert('parseHash: URL エンコードされたコート名を戻す',
      Board.parseHash('#abc/' + encodeURIComponent('東')), { token: 'abc', court: '東' });

    assert('hasNoDetail: 未採点なら false（技の行「未」を描く。レビュー指摘1）',
      Board.hasNoDetail({ tech1: '真', tech2: '連', result: '', score: 0 }), false);
    assert('hasNoDetail: 採点済みで技数と合わない result は true',
      Board.hasNoDetail({ tech1: '真', tech2: '連', tech3: '斬', result: '11   10   ', score: 5 }), true);
    assert('hasNoDetail: 採点済みで技数と合う result は false',
      Board.hasNoDetail({ tech1: '真', tech2: '連', result: '11   10   ', score: 5 }), false);
    assert('hasNoDetail: 選手が null でも false',
      Board.hasNoDetail(null), false);

    // ---- 決戦の暫定順位（配信ボード） ----
    var bfData = { court: 'A', status: 'round2_final', rows: [
      { name: '甲', order: 9, r1: 10, r2: 20, total: 30, scored: true, rank: 2 },
      { name: '乙', order: 10, r1: 40, r2: null, total: 40, scored: false, rank: null }
    ] };
    assert('Board.finaleFor: 候補のコート（A）を映していれば行を返す',
      Board.finaleFor(bfData, 'A').map(function(r) { return r.name; }), ['甲', '乙']);
    assert('Board.finaleFor: 別のコートを映していれば空',
      Board.finaleFor(bfData, 'B'), []);
    assert('Board.finaleFor: 既存データのコート「決戦」でも、そのコートを映していれば行を返す',
      Board.finaleFor({ court: '決戦', status: 'round2_final', rows: bfData.rows }, '決戦').length, 2);
    assert('Board.finaleFor: finale が無ければ空', Board.finaleFor(null, 'A'), []);
    assert('Board.finaleFor: 二巡目 進行中（決戦前）は候補のコートでも空',
      Board.finaleFor({ court: 'A', status: 'round2', rows: bfData.rows }, 'A'), []);
    assert('Board.finaleFor: 二巡目終了・最終結果は空', [
      Board.finaleFor({ court: 'A', status: 'round2_done', rows: bfData.rows }, 'A'),
      Board.finaleFor({ court: 'A', status: 'final', rows: bfData.rows }, 'A')
    ], [[], []]);
    assert('Board.finaleFor: status の無い応答（古いサーバー）は空',
      Board.finaleFor({ court: 'A', rows: bfData.rows }, 'A'), []);
    assert('Board.finaleFor: コート未指定なら空', Board.finaleFor(bfData, ''), []);

    // storage.js テスト（大会ファイルのファイル名。純粋関数）
    var h2s = document.createElement('h2');
    h2s.textContent = 'storage.js';
    results.appendChild(h2s);

    assert('bundleFilename: 大会名と日付を並べる',
      Storage.bundleFilename('名古屋城決戦', '2025-10-25'),
      'tameshigiri_2025-10-25_名古屋城決戦.json');
    assert('bundleFilename: 使えない文字は _ にする',
      Storage.bundleFilename('a/b\\c:d*e?f"g<h>i|j', '2025-10-25'),
      'tameshigiri_2025-10-25_a_b_c_d_e_f_g_h_i_j.json');
    assert('bundleFilename: 制御文字も _ にする',
      Storage.bundleFilename('a\nb\tc', '2025-10-25'),
      'tameshigiri_2025-10-25_a_b_c.json');
    assert('bundleFilename: 大会名は40文字で切る',
      Storage.bundleFilename('あ'.repeat(45), '2025-10-25'),
      'tameshigiri_2025-10-25_' + 'あ'.repeat(40) + '.json');
    assert('bundleFilename: 日付が無ければ nodate',
      Storage.bundleFilename('大会', ''), 'tameshigiri_nodate_大会.json');
    assert('bundleFilename: 日付の形が違えば nodate',
      Storage.bundleFilename('大会', '2025/10/25'), 'tameshigiri_nodate_大会.json');
    assert('bundleFilename: 大会名が空なら「大会」',
      Storage.bundleFilename('', '2025-10-25'), 'tameshigiri_2025-10-25_大会.json');
    assert('bundleFilename: 前後の空白は落とす',
      Storage.bundleFilename('  名古屋  ', '2025-10-25'), 'tameshigiri_2025-10-25_名古屋.json');
    assert('bundleFilename: null でも落ちない',
      Storage.bundleFilename(null, null), 'tameshigiri_nodate_大会.json');

    // ---- 運営画面のモード（PC / スマホ）とハッシュの対応（設計書「モードの切り替え」） ----
    // 端末に控えてあるモードをテストで書き換えるので、最後に元へ戻す。
    var modeSaved = null;
    try { modeSaved = localStorage.getItem('tmg_mode'); } catch (e) {}

    assert('mapHash: #events はどちらのモードでも #events',
      [Storage.mapHash('#events', 'pc'), Storage.mapHash('#events', 'mobile')], ['#events', '#events']);
    assert('mapHash: 空のハッシュは #events', Storage.mapHash('', 'pc'), '#events');
    assert('mapHash: null でも #events', Storage.mapHash(null, 'pc'), '#events');
    assert('mapHash: 先頭の # は無くてもよい', Storage.mapHash('players/e1', 'pc'), '#players/e1');
    assert('mapHash: 大会IDの無い区画は #events に落とす', Storage.mapHash('#players', 'pc'), '#events');
    assert('mapHash: #players はどちらでもそのまま',
      [Storage.mapHash('#players/e1', 'pc'), Storage.mapHash('#players/e1', 'mobile')],
      ['#players/e1', '#players/e1']);
    assert('mapHash: #results はどちらでもそのまま',
      [Storage.mapHash('#results/e1', 'pc'), Storage.mapHash('#results/e1', 'mobile')],
      ['#results/e1', '#results/e1']);
    assert('mapHash: スマホの #round は PC の #match', Storage.mapHash('#round/e1', 'pc'), '#match/e1');
    assert('mapHash: PC の #match はスマホの #round', Storage.mapHash('#match/e1', 'mobile'), '#round/e1');
    assert('mapHash: PC の #round2（二巡目の形登録）は PC ではそのまま', Storage.mapHash('#round2/e1', 'pc'), '#round2/e1');
    assert('mapHash: PC の #round2 はスマホの #round（形登録は試合進行タブ）', Storage.mapHash('#round2/e1', 'mobile'), '#round/e1');
    assert('mapHash: #setup は PC ではそのまま', Storage.mapHash('#setup/e1', 'pc'), '#setup/e1');
    assert('mapHash: PC にしか無い #setup はスマホでは #players',
      Storage.mapHash('#setup/e1', 'mobile'), '#players/e1');
    assert('mapHash: PC にしか無い #techniques はスマホでは #players',
      Storage.mapHash('#techniques/e1', 'mobile'), '#players/e1');
    assert('mapHash: 知らない区画は #events', Storage.mapHash('#zzz/e1', 'pc'), '#events');
    assert('mapHash: 大会IDのエンコードはそのまま保つ',
      Storage.mapHash('#players/' + encodeURIComponent('a b'), 'pc'), '#players/a%20b');

    assert('modeHref: pc は desk.html', Storage.modeHref('#round/e1', 'pc'), 'desk.html#match/e1');
    assert('modeHref: mobile は admin.html', Storage.modeHref('#match/e1', 'mobile'), 'admin.html#round/e1');
    assert('modeHref: 知らないモードはスマホ扱い', Storage.modeHref('#events', 'zzz'), 'admin.html#events');

    Storage.saveMode('pc');
    assert('loadMode: 控えた値を返す', Storage.loadMode(), 'pc');
    assert('adminHref: 控えが pc なら desk.html', Storage.adminHref('#round/e1'), 'desk.html#match/e1');
    Storage.saveMode('mobile');
    assert('adminHref: 控えが mobile なら admin.html', Storage.adminHref('#setup/e1'), 'admin.html#players/e1');
    Storage.saveMode('zzz');
    assert('saveMode: 知らない値は控えない（前の値のまま）', Storage.loadMode(), 'mobile');

    // currentMode は「控え → 無ければ画面幅」の判定。adminHref がこれを使う。
    Storage.saveMode('pc');
    assert('currentMode: 控えた値をそのまま返す', Storage.currentMode(), 'pc');
    Storage.saveMode('mobile');
    assert('currentMode: 控えを変えたら追従する', Storage.currentMode(), 'mobile');
    try { localStorage.removeItem('tmg_mode'); } catch (e) {}
    assert('currentMode: 控えが無くても pc か mobile のどちらかを返す',
      ['pc', 'mobile'].indexOf(Storage.currentMode()) !== -1, true);
    // 控えが無いときの既定は画面幅で決まる（テストの窓幅に依るので値は固定しない）。
    // 大事なのは「ボタンの表示に使う currentMode」と「リンクの行き先 adminHref」が食い違わないこと。
    assert('currentMode: adminHref と同じモードを指す',
      Storage.adminHref('#events'),
      (Storage.currentMode() === 'pc' ? 'desk.html' : 'admin.html') + '#events');
    try {
      if (modeSaved === null) localStorage.removeItem('tmg_mode');
      else localStorage.setItem('tmg_mode', modeSaved);
    } catch (e) {}

    assert('todayLocal: YYYY-MM-DD の形', /^\d{4}-\d{2}-\d{2}$/.test(Storage.todayLocal()), true);

    // ---- 取り込むファイルの検証（PC 運営とスマホ運営で共用。文言はサーバーと揃える） ----
    assert('checkBundle: 正しいファイルは ok',
      Storage.checkBundle({ format: 'phx-tameshigiri-event', version: 1, event: { name: 'a' } }),
      { ok: true });
    assert('checkBundle: format が違えば断る',
      Storage.checkBundle({ format: 'x', version: 1 }),
      { ok: false, error: 'このアプリのエクスポートファイルではありません。' });
    assert('checkBundle: JSON がオブジェクトでなければ断る',
      Storage.checkBundle('abc'),
      { ok: false, error: 'このアプリのエクスポートファイルではありません。' });
    assert('checkBundle: null でも落ちない',
      Storage.checkBundle(null),
      { ok: false, error: 'このアプリのエクスポートファイルではありません。' });
    assert('checkBundle: version が違えば更新を促す',
      Storage.checkBundle({ format: 'phx-tameshigiri-event', version: 2 }),
      { ok: false, error: '対応していないファイル形式です（version: 2）\nこのアプリを更新してください。' });

    await runApiTests();
    await runScoringAuditTests();
    await runInviteTests();

    // 結果サマリ
    var summary = document.createElement('p');
    summary.style.marginTop = '24px';
    summary.style.fontWeight = 'bold';
    summary.textContent = 'Result: ' + passed + ' passed, ' + failed + ' failed';
    results.appendChild(summary);
  })();
</script>
</body>
</html>
