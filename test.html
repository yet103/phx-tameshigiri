<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Unit Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; font-weight: bold; }
    h2 { margin-top: 24px; }
  </style>
</head>
<body>
<h1>試し斬りアプリ テスト</h1>
<div id="results"></div>
<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="api.js"></script>
<script src="storage.js"></script>
<script src="courts.js"></script>
<script src="route.js"></script>
<script src="outbox.js"></script>
<script src="techpicker.js"></script>
<script src="admin.js"></script>
<script src="present.js"></script>
<script>
  var results = document.getElementById('results');
  var passed = 0, failed = 0;

  function assert(desc, actual, expected) {
    var ok = JSON.stringify(actual) === JSON.stringify(expected);
    var el = document.createElement('div');
    el.className = ok ? 'pass' : 'fail';
    el.textContent = (ok ? '✓ ' : '✗ ') + desc +
      (ok ? '' : ' → got: ' + JSON.stringify(actual) + ' expected: ' + JSON.stringify(expected));
    results.appendChild(el);
    ok ? passed++ : failed++;
  }

  async function runApiTests() {
    var h2 = document.createElement('h2');
    h2.textContent = 'api.js';
    results.appendChild(h2);

    // 技術APIテスト
    var techData = await Api.loadTechniques();
    assert('loadTechniques は技術リストを返す', Array.isArray(techData.techniques), true);
    assert('loadTechniques isCustom はbool', typeof techData.isCustom, 'boolean');
    if (techData.isCustom) {
      // カスタム保存済み環境ではデフォルトとの一致は検証できない
      var skip = document.createElement('div');
      skip.textContent = '… カスタム技術が保存されているため、デフォルト一致チェックはスキップ';
      results.appendChild(skip);
    } else {
      // サーバーのデフォルトが data.js と食い違うと採点が0点になるため厳密に比較する
      assert('サーバーのデフォルト技術数は data.js と一致', techData.techniques.length, TECHNIQUES.length);
      assert('サーバーのデフォルト技術定義は data.js と一致', techData.techniques, TECHNIQUES);
    }

    // 大会作成テスト
    var result = await Api.saveEvent({ name: 'テスト大会', date: '2025-01-01', venue: 'テスト会場', players: [] });
    assert('saveEvent 成功', result.success, true);
    assert('saveEvent idあり', !!result.id, true);
    var testEventId = result.id;

    // 大会取得テスト
    var loaded = await Api.loadEvent(testEventId);
    assert('loadEvent name', loaded.name, 'テスト大会');
    assert('loadEvent players空', loaded.players.length, 0);

    // 一括登録
    var bulk = await Api.createPlayersBulk(testEventId, {
      court: 'B', isFemale: true, isNewFace: true, names: ['佐藤 花', '', '  ', '鈴木 梅 ', '高橋 桜']
    });
    assert('bulk: 空行を除いた人数を作る', bulk.created, 3);
    assert('bulk: 順番はコート×性別で連番', bulk.players.map(function(p) { return p.order; }), ['B-女子-1-1', 'B-女子-1-2', 'B-女子-1-3']);
    assert('bulk: 名前は trim', bulk.players[1].name, '鈴木 梅');
    assert('bulk: 性別・新人が付く', [bulk.players[0].isFemale, bulk.players[0].isNewFace], [true, true]);
    assert('bulk: 技は空', [bulk.players[0].tech1, bulk.players[0].tech2, bulk.players[0].tech3], ['', '', '']);
    var bulk2 = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: true, isNewFace: false, names: ['田中 藤'] });
    assert('bulk: 既存の続きから採番', bulk2.players[0].order, 'B-女子-1-4');
    var bulkEmptyNames = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: false, names: ['', ' '] });
    assert('bulk: 名前が全部空なら理由を返す', bulkEmptyNames && bulkEmptyNames.error, '登録する名前がありません');
    var bulkBadCourt = await Api.createPlayersBulk(testEventId, { court: 'A-1', isFemale: false, names: ['x'] });
    assert('bulk: 不正なコートは理由を返す', bulkBadCourt && bulkBadCourt.error, '不正なコート名です');
    var bulkNotArray = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: false, names: 'x' });
    assert('bulk: names が配列でなければ理由を返す', bulkNotArray && bulkNotArray.error, '名前の配列が必要です');
    var manyNames = [];
    for (var mi = 0; mi < 501; mi++) manyNames.push('大量' + mi);
    var bulkTooMany = await Api.createPlayersBulk(testEventId, { court: 'B', isFemale: false, names: manyNames });
    assert('bulk: 501件は理由を返す', bulkTooMany && bulkTooMany.error, '一度に登録できるのは500名までです');
    var bulkLoaded = await Api.loadEvent(testEventId);
    assert('bulk: 大会に4名入っている', bulkLoaded.players.length, 4);
    await Api.importCsv(testEventId, '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n', 'replace');   // 後続のテストのため空に戻す

    // PATCH: 補正点・備考・確定・負の得点
    // 採点済みの選手を残すと後続の replace インポートが採点済みガードに引っかかるので、専用の大会で行う
    var padEvent = await Api.saveEvent({ name: '補正点テスト', date: '2026-09-13', venue: '', players: [] });
    await Api.importCsv(padEvent.id, '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n補正 太郎,A-男子-1-9,四方,,,0,,,', 'replace');
    var padLoaded = await Api.loadEvent(padEvent.id);
    var padP = padLoaded.players.filter(function(p) { return p.name === '補正 太郎'; })[0];
    var padRes = await Api.updatePlayerInfo(padEvent.id, padP.id, {
      adjust: [1, -2, 0], totalAdjust: -3, note: '  審判メモ  ', confirmed: true, score: -4
    });
    assert('PATCH adjust を保存', padRes.player.adjust, [1, -2, 0]);
    assert('PATCH totalAdjust を保存', padRes.player.totalAdjust, -3);
    assert('PATCH note は trim', padRes.player.note, '審判メモ');
    assert('PATCH confirmed を保存', padRes.player.confirmed, true);
    assert('PATCH 負の score を受理', padRes.player.score, -4);
    var badRes = await Api.updatePlayerInfo(padEvent.id, padP.id, {
      adjust: [1, 2], totalAdjust: 1.5, note: 12, confirmed: 'yes', score: NaN
    });
    assert('PATCH 長さ3でない adjust は無視', badRes.player.adjust, [1, -2, 0]);
    assert('PATCH 整数でない totalAdjust は無視', badRes.player.totalAdjust, -3);
    assert('PATCH 文字列でない note は無視', badRes.player.note, '審判メモ');
    assert('PATCH 真偽値でない confirmed は無視', badRes.player.confirmed, true);
    var csvOut = await Api.exportCsv(padEvent.id);
    var csvHead = csvOut.replace(/^\uFEFF/, '').split('\r\n')[0];
    assert('export は15列', csvHead.split(',').length, 15);
    assert('export のヘッダー末尾', csvHead.split(',').slice(9), ['補正点1', '補正点2', '補正点3', '全体補正', '備考', '確定']);
    var csvRow = csvOut.replace(/^\uFEFF/, '').split('\r\n').filter(function(l) { return l.indexOf('補正 太郎') === 0; })[0];
    assert('export に補正点・確定が出る', csvRow.split(',').slice(9), ['1', '-2', '0', '-3', '審判メモ', '○']);
    var longNote = new Array(202).join('あ');   // 201文字
    var longRes = await Api.updatePlayerInfo(padEvent.id, padP.id, { note: longNote });
    assert('PATCH note は200文字で切る', longRes.player.note.length, 200);
    await Api.deleteEvent(padEvent.id);

    // CSVインポートテスト
    var csv = '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n山田 太郎,A-男子-1-1,破図味,夢想返し,響き返し,55,,,';
    var importResult = await Api.importCsv(testEventId, csv, 'replace');
    assert('importCsv 成功', importResult.success, true);
    assert('importCsv playerCount', importResult.playerCount, 1);

    // インポート後の確認
    var reloaded = await Api.loadEvent(testEventId);
    assert('import後 player名', reloaded.players[0].name, '山田 太郎');
    assert('import後 tech1', reloaded.players[0].tech1, '破図味');

    // 簡易列の CSV（順番はサーバーが採番）
    var simpleCsv = '名前,コート,性別,技①,技②,技③,新人\n' +
      '簡易 一郎,A,男,四方,,,\n' +
      '簡易 二子,A,女子,水月,陽中陰,夢想返し,○\n' +
      '簡易 三郎,A,男子,,,,1\n' +
      ',A,男,,,,\n' +
      '簡易 四子,B,○,,,,';
    // 直前の「CSVインポートテスト」で score=55 の選手が入っており isScored 判定に
    // 引っかかるため、この置換は force で通す（検証したいのは形式判別であって
    // 採点済みガードではないため）。
    var simpleRes = await Api.importCsv(testEventId, simpleCsv, 'replace', true);
    assert('簡易CSV: 空の名前を飛ばす', simpleRes.playerCount, 4);
    var simpleLoaded = await Api.loadEvent(testEventId);
    var sp = simpleLoaded.players;
    assert('簡易CSV: 順番はコート×性別で採番', sp.map(function(p) { return p.order; }), ['A-男子-1-1', 'A-女子-1-1', 'A-男子-1-2', 'B-女子-1-1']);
    assert('簡易CSV: 技', [sp[1].tech1, sp[1].tech2, sp[1].tech3], ['水月', '陽中陰', '夢想返し']);
    assert('簡易CSV: 新人（○）', sp[1].isNewFace, true);
    assert('簡易CSV: 新人（1）', sp[2].isNewFace, true);
    assert('簡易CSV: 新人なし', sp[0].isNewFace, false);
    assert('簡易CSV: 性別 ○ は女子', sp[3].isFemale, true);
    await Api.importCsv(testEventId, '名前,コート,性別\n追記 五郎,A,男', 'append');
    var appended2 = await Api.loadEvent(testEventId);
    assert('簡易CSV: 追記は既存の続きから採番', appended2.players[4].order, 'A-男子-1-3');
    var badCourtRes = await Api.importCsv(testEventId, '名前,コート,性別\n誰か,A-1,男', 'append');
    assert('簡易CSV: 不正なコートは理由を返す', badCourtRes && badCourtRes.error, '2 行目のコート名が不正です');

    // 途中の行のコートが不正なら何も書き込まない（部分書き込みの回帰テスト）
    var beforePartial = await Api.loadEvent(testEventId);
    var partialCsv = '名前,コート,性別\n' +
      '部分 一郎,A,男\n' +
      '部分 二郎,A-1,男\n' +
      '部分 三郎,A,男';
    var partialRes = await Api.importCsv(testEventId, partialCsv, 'append');
    assert('簡易CSV: 途中のコート不正でも理由を返す', !!(partialRes && partialRes.error), true);
    var afterPartial = await Api.loadEvent(testEventId);
    assert('簡易CSV: 途中のコート不正なら選手は増えない', afterPartial.players.length, beforePartial.players.length);

    // 技名の前後の空白は落とす（末尾空白があると Scoring.findTechnique の完全一致に掛からず0点になる）
    var spacedCsv = '名前,コート,性別,技①,技②,技③,新人\n' +
      '空白 太郎,A,男, 四方 ,,,';
    await Api.importCsv(testEventId, spacedCsv, 'replace');
    var spacedLoaded = await Api.loadEvent(testEventId);
    assert('簡易CSV: 技名の前後の空白を落とす', spacedLoaded.players[0].tech1, '四方');

    // 拡張15列（エクスポートの往復）
    var fullCsv = '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果,補正点1,補正点2,補正点3,全体補正,備考,確定\n' +
      '拡張 太郎,C-男子-1-1,四方,,,10,,,1    ,2,0,0,-1,メモ,○';
    await Api.importCsv(testEventId, fullCsv, 'replace');
    var fullLoaded = await Api.loadEvent(testEventId);
    assert('拡張CSV: 補正点', fullLoaded.players[0].adjust, [2, 0, 0]);
    assert('拡張CSV: 全体補正・備考・確定', [fullLoaded.players[0].totalAdjust, fullLoaded.players[0].note, fullLoaded.players[0].confirmed], [-1, 'メモ', true]);
    // 直前で score=10 の選手を作っており isScored 判定に引っかかるため、この reset も
    // force で通す（force を付けないと 409 で拒否され、実際には空に戻っていなかった）。
    await Api.importCsv(testEventId, '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n', 'replace', true);   // 後続のテストのため空に戻す

    // 大会削除テスト
    await Api.deleteEvent(testEventId);
    var deleted = await Api.loadEvent(testEventId);
    assert('deleteEvent 後 null', deleted, null);

    // 大会一覧テスト
    var events = await Api.listEvents();
    assert('listEvents は配列', Array.isArray(events), true);

    // 並行PATCHの回帰テスト
    // 書き込みハンドラが同期である限り、同時PATCHは取りこぼされない。
    // 将来ハンドラが async 化されるとこのテストが落ちる（不変条件の番人）。
    var raceEvent = await Api.saveEvent({ name: '並行テスト', date: '2026-01-01', venue: '', players: [] });
    var raceCsv = '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n';
    for (var ri = 1; ri <= 12; ri++) {
      raceCsv += 'P' + ri + ',A-男子-1-' + ri + ',真,,,0,,,\n';
    }
    await Api.importCsv(raceEvent.id, raceCsv, 'replace');
    var raceLoaded = await Api.loadEvent(raceEvent.id);
    var raceIds = raceLoaded.players.map(function(p) { return p.id; });
    await Promise.all(raceIds.map(function(pid, i) {
      return Api.updatePlayer(raceEvent.id, pid, { score: (i + 1) * 10, result: '' });
    }));
    var raceAfter = await Api.loadEvent(raceEvent.id);
    var raceExpected = raceIds.map(function(_, i) { return (i + 1) * 10; });
    assert('並行PATCH12本が全件反映される',
      raceAfter.players.map(function(p) { return p.score; }),
      raceExpected);
    await Api.deleteEvent(raceEvent.id);

    // インポートガードのテスト
    var guardEvent = await Api.saveEvent({ name: 'ガードテスト', date: '2026-01-01', venue: '', players: [] });
    var guardCsv = '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' +
                   '採点済,A-男子-1-1,真,,,30,,,1    \n';
    await Api.importCsv(guardEvent.id, guardCsv, 'replace');

    // 採点済みデータがある大会への replace は 409 で拒否される
    var blocked = await Api.importCsv(guardEvent.id, guardCsv, 'replace');
    assert('採点済み大会へのreplaceは拒否される', blocked.blocked, true);
    assert('拒否時に採点済み人数を返す', blocked.scoredCount, 1);

    // force を付ければ通る
    var forced = await Api.importCsv(guardEvent.id, guardCsv, 'replace', true);
    assert('forceを付けたreplaceは成功する', forced.success, true);

    // append は採点済みでも拒否しない
    var appended = await Api.importCsv(guardEvent.id, guardCsv, 'append');
    assert('appendは採点済みでも拒否しない', appended.success, true);

    await Api.deleteEvent(guardEvent.id);

    // 未採点のみの大会は replace を拒否されない（誤検知の回帰テスト）
    var cleanEvent = await Api.saveEvent({ name: 'ガードテスト2', date: '2026-01-01', venue: '', players: [] });
    var cleanCsv = '選手名,順番,技 1,技 2,技 3,得点,新人,女子,結果\n' +
                   '未採点,A-男子-1-1,真,,,0,,,\n';
    await Api.importCsv(cleanEvent.id, cleanCsv, 'replace');
    var cleanAgain = await Api.importCsv(cleanEvent.id, cleanCsv, 'replace');
    assert('未採点のみの大会へのreplaceは拒否されない', cleanAgain.success, true);
    await Api.deleteEvent(cleanEvent.id);

    // --- 選手の手動追加 ---
    var addEvent = await Api.saveEvent({ name: '追加テスト', date: '2026-02-01', venue: '', players: [] });
    var p1 = await Api.createPlayer(addEvent.id, {
      name: '一郎', court: 'A', isFemale: false, isNewFace: false, tech1: '真', tech2: '', tech3: ''
    });
    assert('createPlayer 1人目の order', p1.order, 'A-男子-1-1');
    assert('createPlayer は id を採番する', typeof p1.id, 'string');
    assert('createPlayer の初期得点は0', p1.score, 0);
    assert('createPlayer は result を空で作る', p1.result, '');
    assert('createPlayer は技を保存する', p1.tech1, '真');

    var p2 = await Api.createPlayer(addEvent.id, { name: '二郎', court: 'A', isFemale: false });
    assert('同条件の2人目は -1-2', p2.order, 'A-男子-1-2');
    var p3 = await Api.createPlayer(addEvent.id, { name: '三郎', court: 'B', isFemale: false });
    assert('別コートは番号が1に戻る', p3.order, 'B-男子-1-1');
    var p4 = await Api.createPlayer(addEvent.id, { name: '花子', court: 'A', isFemale: true });
    assert('同コートでも女子は別採番', p4.order, 'A-女子-1-1');
    assert('createPlayer は選手を大会に追加する',
      (await Api.loadEvent(addEvent.id)).players.length, 4);

    var pMass = await Api.createPlayer(addEvent.id, {
      name: '五郎', court: 'A', id: 'hacked', order: 'Z-女子-9-9', score: 999, result: '11111'
    });
    assert('createPlayer は body の id を無視する', pMass.id !== 'hacked', true);
    assert('createPlayer は body の order を無視する', pMass.order, 'A-男子-1-3');
    assert('createPlayer は body の score を無視する', pMass.score, 0);

    assert('name が空なら null', await Api.createPlayer(addEvent.id, { name: '', court: 'A' }), null);
    assert('コート名に - があれば null',
      await Api.createPlayer(addEvent.id, { name: '四郎', court: 'A-1' }), null);
    assert('コート名が未分類なら null',
      await Api.createPlayer(addEvent.id, { name: '四郎', court: '未分類' }), null);
    assert('コート名が33文字以上なら null',
      await Api.createPlayer(addEvent.id, { name: '四郎', court: new Array(34).join('A') }), null);
    assert('存在しない大会は null',
      await Api.createPlayer('nosuchevent', { name: '四郎', court: 'A' }), null);
    await Api.deleteEvent(addEvent.id);

    // --- 選手の削除 ---
    var delEvent = await Api.saveEvent({ name: '削除テスト', date: '2026-02-01', venue: '', players: [] });
    var d1 = await Api.createPlayer(delEvent.id, { name: '一郎', court: 'A', isFemale: false });
    var d2 = await Api.createPlayer(delEvent.id, { name: '二郎', court: 'A', isFemale: false });
    var d3 = await Api.createPlayer(delEvent.id, { name: '三郎', court: 'A', isFemale: false });
    assert('deletePlayer は true を返す', await Api.deletePlayer(delEvent.id, d2.id, false), true);
    assert('削除された選手は大会から消える',
      (await Api.loadEvent(delEvent.id)).players.map(function(p) { return p.name; }), ['一郎', '三郎']);
    var d4 = await Api.createPlayer(delEvent.id, { name: '四郎', court: 'A', isFemale: false });
    assert('削除後の追加は欠番を埋めない（最大+1）', d4.order, 'A-男子-1-4');
    assert('残った選手の順番は動かない',
      (await Api.loadEvent(delEvent.id)).players.map(function(p) { return p.order; }),
      ['A-男子-1-1', 'A-男子-1-3', 'A-男子-1-4']);
    assert('存在しない選手の削除は false',
      await Api.deletePlayer(delEvent.id, 'nosuchplayer', false), false);

    // 採点済みは 409 で拒否し、force で通す
    await Api.updatePlayer(delEvent.id, d1.id, { score: 30, result: '1    ' });
    var delBlocked = await Api.deletePlayer(delEvent.id, d1.id, false);
    assert('採点済みの削除は拒否される', delBlocked.blocked, true);
    assert('拒否時に得点を返す', delBlocked.player.score, 30);
    assert('拒否時に選手名を返す', delBlocked.player.name, '一郎');
    assert('拒否時に順番を返す', delBlocked.player.order, 'A-男子-1-1');
    assert('拒否されても選手は残る', (await Api.loadEvent(delEvent.id)).players.length, 3);
    assert('force=true なら採点済みでも削除できる',
      await Api.deletePlayer(delEvent.id, d1.id, true), true);
    assert('force 削除後は2名', (await Api.loadEvent(delEvent.id)).players.length, 2);
    await Api.deleteEvent(delEvent.id);

    // --- 選手情報の編集 ---
    var edEvent = await Api.saveEvent({ name: '編集テスト', date: '2026-02-01', venue: '', players: [] });
    var edP = await Api.createPlayer(edEvent.id, { name: '一郎', court: 'A', isFemale: false, tech1: '真' });
    var edRes = await Api.updatePlayerInfo(edEvent.id, edP.id, {
      name: '一郎改', id: 'hacked', order: 'Z-男子-9-9', foo: 'bar'
    });

      return names.length;

    assert('open: 続く input(isComposing:false) で確定した文字に絞り込まれる', (function() {
      TechPicker.open({
        techniques: [{ name: '真' }, { name: '夢想返し' }],
        initial: ['', '', ''],
        slot: 0
      });
      var input = document.querySelector('.tp-search input');
      input.value = '返し';
      input.dispatchEvent(new InputEvent('input', { isComposing: true }));
      input.dispatchEvent(new InputEvent('input', { isComposing: false }));
      var names = Array.prototype.map.call(document.querySelectorAll('.tp-item[data-name]'), function(el) { return el.dataset.name; });
      TechPicker.dismiss();
      return names;
    })(), ['夢想返し']);
    assert('open: WebKit想定（isComposing:falseのinputが来ず compositionend だけ）でも絞り込まれる', (function() {
      TechPicker.open({
        techniques: [{ name: '真' }, { name: '夢想返し' }],
        initial: ['', '', ''],
        slot: 0
      });
      var input = document.querySelector('.tp-search input');
      input.value = '返し';
      input.dispatchEvent(new InputEvent('input', { isComposing: true }));
      input.dispatchEvent(new Event('compositionend'));
      var names = Array.prototype.map.call(document.querySelectorAll('.tp-item[data-name]'), function(el) { return el.dataset.name; });
      TechPicker.dismiss();
      return names;
    })(), ['夢想返し']);
    assert('dismiss: onClose を呼ばずに閉じる', (function(){
      var called = false;
      TechPicker.open({ techniques: [{ name: '真' }], initial: ['真', '', ''], slot: 0,
        onClose: function(){ called = true; } });
      TechPicker.dismiss();
      return [called, document.querySelectorAll('.tp-overlay').length];
    })(), [false, 0]);
    assert('openSheet: 2枚開いて closeAllSheets で全部閉じ、onClose は1回ずつ', (function() {
      var n = 0;
      var a = Admin.openSheet('A', document.createElement('div'), [], function() { n++; });
      var b = Admin.openSheet('B', document.createElement('div'), [], function() { n++; });
      b.lock(true);
      Admin.closeAllSheets();
      a.close(); b.close();
      return [n, document.querySelectorAll('.sheet-overlay').length];
    })(), [2, 0]);
    assert('openSheet: lock 中は ✕ で閉じない', (function() {
      var s = Admin.openSheet('L', document.createElement('div'), [], null);
      // このテストが作ったシートに絞る（他のテストが残したシートを誤って掴まないように）
      function myCloseBtn() {
        var overlays = document.querySelectorAll('.sheet-overlay');
        return overlays[overlays.length - 1].querySelector('.sheet-close');
      }
      s.lock(true);
      myCloseBtn().click();
      var still = document.querySelectorAll('.sheet-overlay').length;
      s.lock(false);
      myCloseBtn().click();
      return [still, document.querySelectorAll('.sheet-overlay').length];
    })(), [1, 0]);

    var h2a = document.createElement('h2');
    h2a.textContent = 'admin.js';
    results.appendChild(h2a);

    assert('scoringHref: 大会とコート',
      Admin.scoringHref('abc', 'A'), 'index.html#event/abc/A');
    assert('scoringHref: コート無し',
      Admin.scoringHref('abc', ''), 'index.html#event/abc');
    assert('scoringHref: 大会IDが無ければハッシュ無し',
      Admin.scoringHref('', 'A'), 'index.html');
    assert('scoringHref: 未分類とスペースをエンコードする',
      Admin.scoringHref('a b', '未分類'), 'index.html#event/a%20b/' + encodeURIComponent('未分類'));

    var h2r = document.createElement('h2');
    h2r.textContent = 'route.js';
    results.appendChild(h2r);

    assert('parse: 大会とコート',
      Route.parse('#event/abc123/A'), { eventId: 'abc123', court: 'A' });
    assert('parse: 大会のみ',
      Route.parse('#event/abc123'), { eventId: 'abc123', court: '' });
    assert('parse: 先頭の#が無くても解釈する',
      Route.parse('event/abc123/B'), { eventId: 'abc123', court: 'B' });
    assert('parse: 日本語コート名をデコードする',
      Route.parse('#event/abc123/' + encodeURIComponent('未分類')),
      { eventId: 'abc123', court: '未分類' });
    assert('parse: 空文字はnull', Route.parse(''), null);
    assert('parse: #だけはnull', Route.parse('#'), null);
    assert('parse: 未知のスクリーンはnull', Route.parse('#foo/abc'), null);
    assert('parse: 大会IDが無ければnull', Route.parse('#event/'), null);
    assert('parse: 余分なセグメントは無視する',
      Route.parse('#event/abc/A/extra'), { eventId: 'abc', court: 'A' });
    assert('parse: 大会IDの不正なエンコードはnull', Route.parse('#event/abc%ZZ'), null);
    assert('parse: コート名の不正なエンコードはnull', Route.parse('#event/abc/%E0%A4%A'), null);

    assert('build: 大会とコート', Route.build('abc', 'A'), '#event/abc/A');
    assert('build: コート無し', Route.build('abc', ''), '#event/abc');
    assert('build: 日本語コート名をエンコードする',
      Route.build('abc', '未分類'), '#event/abc/' + encodeURIComponent('未分類'));
    assert('build: 大会IDが無ければ空', Route.build('', 'A'), '');

    var h2o = document.createElement('h2');
    h2o.textContent = 'outbox.js';
    results.appendChild(h2o);

    var e1 = { eventId: 'ev1', playerId: 'p1', score: 10, result: 'a', queuedAt: 't1' };
    var e2 = { eventId: 'ev1', playerId: 'p2', score: 20, result: 'b', queuedAt: 't2' };
    var e1b = { eventId: 'ev1', playerId: 'p1', score: 30, result: 'c', queuedAt: 't3' };

    assert('coalesce: 空キューに1件', Outbox.coalesce([], e1), [e1]);
    assert('coalesce: 別選手は併存する', Outbox.coalesce([e1], e2), [e1, e2]);
    assert('coalesce: 同一選手は最新で置き換える', Outbox.coalesce([e1, e2], e1b), [e1b, e2]);
    assert('coalesce: 置き換えても順序が保たれる',
      Outbox.coalesce([e1, e2], e1b).map(function(x) { return x.playerId; }),
      ['p1', 'p2']);
    assert('coalesce: 元の配列を破壊しない', (function() {
      var q = [e1];
      Outbox.coalesce(q, e1b);
      return q[0].score;
    })(), 10);

    var eOther = { eventId: 'ev2', playerId: 'p1', score: 40, result: 'd', queuedAt: 't4' };
    assert('coalesce: 大会が違えば別エントリ',
      Outbox.coalesce([e1], eOther).length, 2);

    var q1 = Outbox.coalesce([], { eventId: 'e', playerId: 'p', score: 1, result: 'r', adjust: [1, 0, 0], totalAdjust: 2, note: 'n', confirmed: true });
    assert('coalesce は補正点・備考・確定を保つ', [q1[0].adjust, q1[0].totalAdjust, q1[0].note, q1[0].confirmed], [[1, 0, 0], 2, 'n', true]);

    // 備考だけのエントリ（score / result を持たない）が未送信の採点を潰さないこと
    var noteOnly = Outbox.coalesce([], { eventId: 'e', playerId: 'p', note: 'メモ' });
    assert('coalesce: 備考だけのエントリは score/result を作らない',
      ['score' in noteOnly[0], 'result' in noteOnly[0]], [false, false]);
    var mergedQ = Outbox.coalesce(
      [{ eventId: 'e', playerId: 'p', score: 7, result: 'R', adjust: [1, 0, 0], queuedAt: 't1' }],
      { eventId: 'e', playerId: 'p', note: 'あとから備考', queuedAt: 't2' });
    assert('coalesce: 後勝ちでマージし、前のエントリの採点を残す',
      [mergedQ[0].score, mergedQ[0].result, mergedQ[0].adjust, mergedQ[0].note, mergedQ[0].queuedAt],
      [7, 'R', [1, 0, 0], 'あとから備考', 't2']);
    assert('coalesce: マージしても元のエントリを壊さない', (function() {
      var q = [{ eventId: 'e', playerId: 'p', score: 7, result: 'R' }];
      Outbox.coalesce(q, { eventId: 'e', playerId: 'p', note: 'x' });
      return ['note' in q[0], q[0].score];
    })(), [false, 7]);

    // 注意: このページは index.html と localStorage を共有する。
    // 以下のテストは tmg_outbox を一時的に書き換えるため、
    // 採点中の端末でこのページを開かないこと。
    var h2ow = document.createElement('h2');
    h2ow.textContent = 'outbox.js (ワーカー)';
    results.appendChild(h2ow);

    var savedOutbox = localStorage.getItem('tmg_outbox');
    var origUpdate = Api.updatePlayer;

    // 恒久的に送れないエントリ（404）を捨てて後続を送る
    // これを捨てないと、1件の404が先頭に張り付いて以降の採点が全部届かなくなる
    var sent = [];
    Api.updatePlayer = async function(eventId, playerId) {
      sent.push(playerId);
      return playerId === 'gone' ? { ok: false, status: 404 } : { ok: true };
    };
    localStorage.setItem('tmg_outbox', JSON.stringify([
      { eventId: 'ev1', playerId: 'gone',  score: 1, result: 'a', queuedAt: 't1' },
      { eventId: 'ev1', playerId: 'alive', score: 2, result: 'b', queuedAt: 't2' }
    ]));
    var droppedSeen = [];
    Outbox.init(function() {}, function(list) { droppedSeen = droppedSeen.concat(list); });
    await new Promise(function(r) { setTimeout(r, 500); });
    assert('404のエントリを捨てて後続を送る', sent, ['gone', 'alive']);
    assert('捨てたエントリを呼び出し元に伝える', droppedSeen.length, 1);
    assert('捨てた後キューが空になる', Outbox.pendingCount(), 0);

    // 備考だけのエントリは score / result を PATCH に載せない
    // （載せると undefined になり、サーバー側で採点が巻き戻る）
    var bodies = [];
    Api.updatePlayer = async function(eventId, playerId, body) { bodies.push(body); return { ok: true }; };
    localStorage.setItem('tmg_outbox', JSON.stringify([
      { eventId: 'ev1', playerId: 'pn', note: 'メモだけ', queuedAt: 't7' }
    ]));
    Outbox.init(function() {}, function() {});
    await new Promise(function(r) { setTimeout(r, 500); });
    assert('drain: 備考だけのエントリは score/result を送らない',
      [bodies.length, 'score' in (bodies[0] || {}), 'result' in (bodies[0] || {}), (bodies[0] || {}).note],
      [1, false, false, 'メモだけ']);

    // 未送信の採点はサーバーの古い値より優先される
    Api.updatePlayer = async function() { return { ok: false, status: 0 }; };
    localStorage.setItem('tmg_outbox', JSON.stringify([
      { eventId: 'ev1', playerId: 'p1', score: 55, result: 'X', queuedAt: 't3' }
    ]));
    Outbox.init(function() {}, function() {});
    await new Promise(function(r) { setTimeout(r, 400); });
    assert('送れないエントリはキューに残る', Outbox.pendingCount(), 1);
    var fromServer = [
      { id: 'p1', score: 0, result: '' },
      { id: 'p2', score: 9, result: 'Y' }
    ];
    assert('applyPending は上書きした件数を返す', Outbox.applyPending('ev1', fromServer), 1);
    assert('未送信の採点でサーバーの値を上書きする',
      [fromServer[0].score, fromServer[0].result], [55, 'X']);
    assert('キューに無い選手はそのまま',
      [fromServer[1].score, fromServer[1].result], [9, 'Y']);
    assert('別の大会には適用しない', Outbox.applyPending('other', fromServer), 0);

    localStorage.setItem('tmg_outbox', JSON.stringify([
      { eventId: 'ev1', playerId: 'p1', score: 55, result: 'X', adjust: [1, 2, 3], totalAdjust: -1, note: 'メモ', confirmed: true, queuedAt: 't4' },
      { eventId: 'ev1', playerId: 'p2', score: 5, result: 'Y', queuedAt: 't5' }   // 旧形式（新項目なし）
    ]));
    Outbox.init(function() {}, function() {});
    await new Promise(function(r) { setTimeout(r, 400); });
    var fromServer2 = [
      { id: 'p1', score: 0, result: '', adjust: [0, 0, 0], totalAdjust: 0, note: '', confirmed: false },
      { id: 'p2', score: 0, result: '', adjust: [9, 9, 9], totalAdjust: 9, note: '既存', confirmed: true }
    ];
    Outbox.applyPending('ev1', fromServer2);
    assert('applyPending は補正点・備考・確定も上書きする',
      [fromServer2[0].adjust, fromServer2[0].totalAdjust, fromServer2[0].note, fromServer2[0].confirmed],
      [[1, 2, 3], -1, 'メモ', true]);
    assert('applyPending 旧形式のエントリは新項目に触らない',
      [fromServer2[1].adjust, fromServer2[1].totalAdjust, fromServer2[1].note, fromServer2[1].confirmed],
      [[9, 9, 9], 9, '既存', true]);

    localStorage.setItem('tmg_outbox', JSON.stringify([
      { eventId: 'ev1', playerId: 'p3', note: '備考だけ', queuedAt: 't6' }
    ]));
    Outbox.init(function() {}, function() {});
    await new Promise(function(r) { setTimeout(r, 400); });
    var fromServer3 = [{ id: 'p3', score: 42, result: 'Z', note: '' }];
    Outbox.applyPending('ev1', fromServer3);
    assert('applyPending 備考だけのエントリは得点と結果に触らない',
      [fromServer3[0].score, fromServer3[0].result, fromServer3[0].note], [42, 'Z', '備考だけ']);

    // 後始末: 本物のキューの内容とメモリ上の状態を元に戻す
    Api.updatePlayer = origUpdate;
    if (savedOutbox === null) localStorage.removeItem('tmg_outbox');
    else localStorage.setItem('tmg_outbox', savedOutbox);
    Outbox.init(function() {}, function() {});

    // present.js（発表モードで開く順）
    var h2p = document.createElement('h2');
    h2p.textContent = 'present.js';
    results.appendChild(h2p);

    assert('revealOrder: 空配列は空', Present.revealOrder([]), []);
    assert('revealOrder: null でも落ちない', Present.revealOrder(null), []);
    assert('revealOrder: 1件は [0]', Present.revealOrder([{ rank: 1, name: 'A', score: 1 }]), [0]);
    var revRows = [
      { rank: 1, name: 'A', score: 74 },
      { rank: 1, name: 'B', score: 74 },
      { rank: 3, name: 'C', score: 62 }
    ];
    assert('revealOrder: 下位から順に開く', Present.revealOrder(revRows), [2, 1, 0]);
    assert('revealOrder: 同順位もまとめず1人ずつ', Present.revealOrder(revRows).length, revRows.length);
    assert('revealOrder: 最後に開くのは1位の行',
      revRows[Present.revealOrder(revRows)[revRows.length - 1]].rank, 1);

    await runApiTests();

    // 結果サマリ
    var summary = document.createElement('p');
    summary.style.marginTop = '24px';
    summary.style.fontWeight = 'bold';
    summary.textContent = 'Result: ' + passed + ' passed, ' + failed + ' failed';
    results.appendChild(summary);
  })();
</script>
</body>
</html>
