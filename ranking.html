<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHX試し斬り 順位</title>
  <meta name="application-name" content="PHX試し斬り">
  <meta name="apple-mobile-web-app-title" content="PHX試し斬り">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <div class="page-links">
    <a href="index.html">トップ</a>
    <a href="scoring.html">採点</a>
    <a href="admin.html">運営</a>
    <a href="techniques.html">技得点表</a>
    <strong>順位表示</strong>
    <a href="help.html">ヘルプ</a>
  </div>

  <div class="container" style="padding-top:16px;">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
      <h2 style="margin:0;">順位表示</h2>
      <select id="rankEventSelect">
        <option value="">-- 大会を選択 --</option>
      </select>
      <button id="btnLoadFromEvent" class="btn-neutral">大会データを読み込む</button>
      <button id="btnDownloadHtml" class="btn-neutral">HTMLダウンロード</button>
      <button class="theme-btn" id="btnTheme">🌙 ダーク</button>
    </div>

    <div class="ranking-container" id="rankingContainer">
      <p style="color:var(--text-muted)">大会を選択すると順位が表示されます。</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="storage.js"></script>
  <script src="ranking.js"></script>
  <script>
    var body = document.body;
    var rankingContainer = document.getElementById('rankingContainer');
    var rankEventSelect = document.getElementById('rankEventSelect');
    var btnLoadFromEvent = document.getElementById('btnLoadFromEvent');

    // 順位の集計はサーバーの computeRanking が唯一の実装。この画面は描くだけ。
    var CATEGORIES = [
      { key: 'male',    title: '一般男子' },
      { key: 'newFace', title: '新人枠' },
      { key: 'female',  title: '一般女子' }
    ];

    function applyTheme(theme) {
      body.setAttribute('data-theme', theme);
      document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀ ライト' : '🌙 ダーク';
    }
    applyTheme(Storage.loadTheme());

    document.getElementById('btnTheme').addEventListener('click', function() {
      var t = Storage.loadTheme() === 'dark' ? 'light' : 'dark';
      Storage.saveTheme(t);
      applyTheme(t);
    });

    // 大会一覧を読み込む
    (async function() {
      var events = await Api.listEvents();
      if (!events) {
        alert('大会一覧を取得できませんでした。通信を確認してください。');
        return;
      }
      events.forEach(function(ev) {
        var opt = document.createElement('option');
        opt.value = ev.id;
        opt.textContent = ev.name + ' (' + ev.date + ')';
        rankEventSelect.appendChild(opt);
      });
      applyHash();   // #event/<id> で開いたら（ダッシュボードの面）その大会を自動で読む
    })();

    // --- URL のハッシュで大会を指定して開く（設計書 2026-10-05-dashboard-design.md §3） ---
    // ダッシュボードの面として iframe で開かれるので、alert は出さず画面内の 1 行にし、
    // 10 秒ごとに読み直す（確定するたび順位が動く）。ハッシュ無しで開いたときは今までどおり
    // ボタンで 1 回読むだけ（自動更新なし）。
    var AUTO_REFRESH_MS = 10000;
    var autoTimer = null;
    var autoEventId = '';

    function showNote(text) {
      rankingContainer.innerHTML = '';
      var p = document.createElement('p');
      p.style.color = 'var(--text-muted)';
      p.textContent = text;
      rankingContainer.appendChild(p);
    }

    // 大会を読んで描く。quiet はハッシュ経由: alert の代わりに画面内の 1 行
    async function loadAndRender(eventId, quiet) {
      var data = await Api.loadRanking(eventId);
      if (!data) {
        if (quiet) showNote('順位を読み込めませんでした。' + (AUTO_REFRESH_MS / 1000) + ' 秒後にもう一度読みます。');
        else alert('順位データの読み込みに失敗しました。');
        return;
      }
      renderRankings(data);
    }

    function stopAuto() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
      autoEventId = '';
    }

    function startAuto(eventId) {
      stopAuto();
      autoEventId = eventId;
      rankEventSelect.value = eventId;
      loadAndRender(eventId, true);
      autoTimer = setInterval(function() { loadAndRender(autoEventId, true); }, AUTO_REFRESH_MS);
    }

    function applyHash() {
      var id = Ranking.parseHash(location.hash);
      if (!id) { stopAuto(); return; }
      if (id !== autoEventId) startAuto(id);
    }
    window.addEventListener('hashchange', applyHash);

    // 大会データを読み込む（ボタン）。ハッシュの大会と違う大会を手で読んだら自動更新は止める
    btnLoadFromEvent.addEventListener('click', function() {
      var eventId = rankEventSelect.value;
      if (!eventId) {
        alert('大会を選択してください。');
        return;
      }
      if (eventId !== autoEventId) stopAuto();
      loadAndRender(eventId, false);
    });

    function renderRankings(data) {
      rankingContainer.innerHTML = '';
      var ev = data.event || {};
      // ダウンロードした単体HTMLだけを見てもどの大会か分かるよう、見出しを出す
      // （大会名が無ければ、意味のある見出しにならないので省略する）。
      // rank-heading クラスは HTML ダウンロード時に表本体と切り分けるための目印。
      // theme.css がダウンロード先には無いので、色は変数でなくリテラルで指定する。
      if (ev.name) {
        var heading = document.createElement('div');
        heading.className = 'rank-heading';
        heading.innerHTML = '<h2>' + Storage.esc(ev.name) + '</h2>' +
          '<p style="color:#666">' +
          Storage.esc(ev.date || '') + '　' + Storage.esc(ev.venue || '') + '</p>';
        rankingContainer.appendChild(heading);
      }
      CATEGORIES.forEach(function(c) {
        rankingContainer.appendChild(
          buildRankTable(c.title, (data.rankings && data.rankings[c.key]) || [],
            data.progress && data.progress[c.key],
            (c.key === 'male' && data.best4Chance) ? data.best4Chance : null));
      });
    }

    // progress（省略可）: { label } 「一巡目 12/17」= その巡目で確定した人数／全員（サーバーの roundProgress）
    // chance（省略可。一般男子だけ）: サーバーの best4Chance = { remaining, male: [ {flag,label,max} | null, ... ] }
    // （rows と同じ並び）。あれば見出しに「残り n 名」、「ベスト4」の列（◎ 確定・○ 可能性あり・✕ 圏外）を出す
    function buildRankTable(title, rows, progress, chance) {
      var div = document.createElement('div');
      div.className = 'ranking-section';
      var head = '<h3>' + Storage.esc(title) +
        (progress && progress.label
          ? ' <span style="font-weight:normal;font-size:13px;color:#666">' + Storage.esc(progress.label) + '</span>'
          : '') +
        (chance && typeof chance.remaining === 'number'
          ? ' <span style="font-weight:normal;font-size:13px;color:#666">残り ' + chance.remaining + ' 名</span>'
          : '') + '</h3>';
      var withChance = !!(chance && Array.isArray(chance.male));
      if (rows.length === 0) {
        div.innerHTML = head + '<p style="color:#666">データなし</p>';
        return div;
      }
      var trs = rows.map(function(r, i) {
        var c = withChance ? chance.male[i] : null;
        return '<tr><td>' + Storage.esc(String(r.rank)) + '</td><td>' + Storage.esc(r.name) +
               '</td><td>' + Storage.esc(String(r.score)) + '</td>' +
               (withChance ? '<td style="font-size:12px;white-space:nowrap' + (c && c.flag === 'sure' ? ';font-weight:bold' : (c && c.flag === 'out' ? ';color:#888' : '')) + '"' +
                 (c && typeof c.max === 'number' ? ' title="最大 ' + c.max + ' 点"' : '') + '>' + Storage.esc((c && c.label) || '') + '</td>' : '') +
               '</tr>';
      }).join('');
      div.innerHTML = head +
        '<table class="rank-table"><tr><th>順位</th><th>選手名</th><th>得点</th>' + (withChance ? '<th>ベスト4</th>' : '') + '</tr>' +
        trs + '</table>';
      return div;
    }

    document.getElementById('btnDownloadHtml').addEventListener('click', function() {
      var sections = rankingContainer.querySelectorAll('.ranking-section');
      if (sections.length === 0) {
        alert('大会データを読み込んでから順位を表示してください。');
        return;
      }
      // 見出し（rank-heading）は表と同じ innerHTML をそのまま flex 行に入れると
      // 横に並ぶ列の1つになってしまうため、表本体（.ranking-section）とは別に
      // 取り出して flex の外に置く。
      var headingEl = rankingContainer.querySelector('.rank-heading');
      var headingHTML = headingEl ? headingEl.outerHTML : '';
      var sectionsHTML = '';
      for (var i = 0; i < sections.length; i++) sectionsHTML += sections[i].outerHTML;
      var html = '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">' +
        '<style>body{font-family:sans-serif}table{border-collapse:collapse;display:inline-table;margin:0 16px 16px 0}' +
        'th,td{border:1px solid #999;padding:6px 12px}th{background:#eee}h3{margin-bottom:8px}</style></head>' +
        '<body>' + headingHTML + '<div style="display:flex;flex-wrap:wrap">' +
        sectionsHTML + '</div></body></html>';
      Storage.downloadHtml('ranking.html', html);
    });
  </script>
</body>
</html>
