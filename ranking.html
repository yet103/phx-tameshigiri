<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHX試し斬り 順位</title>
  <meta name="application-name" content="PHX試し斬り">
  <meta name="apple-mobile-web-app-title" content="PHX試し斬り">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light" class="ranking-page">
  <script>
    // ダッシュボードなどの面（iframe）の中では、他の画面へのリンクの行を隠す（面の中から運営画面などへ移らせない。
    // 設計書 2026-10-10 レビュー指摘）
    try { if (window.self !== window.top) document.body.classList.add('embedded'); } catch (e) { document.body.classList.add('embedded'); }
  </script>

  <div class="page-links">
    <a href="index.html">トップ</a>
    <a href="scoring.html">採点</a>
    <a href="admin.html">運営</a>
    <a href="techniques.html">技得点表</a>
    <strong>順位表示</strong>
    <a href="help.html">ヘルプ</a>
  </div>

  <div class="container" style="padding-top:16px;">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
      <h2 style="margin:0;">順位表示</h2>
      <select id="rankEventSelect" aria-label="大会">
        <option value="">-- 大会を選択 --</option>
      </select>
      <label class="rank-zoom">文字 <input type="range" id="rankZoom" min="50" max="200" step="10" value="100"> <span id="rankZoomVal">100%</span></label>
      <!-- 表示の設定（端末に覚える。Ranking.loadOpts / saveOpts）: 合計の内訳「41+44」、ベスト4 の列 -->
      <label class="rank-opt"><input type="checkbox" id="rankShowDetail"> 内訳</label>
      <label class="rank-opt"><input type="checkbox" id="rankShowBest4"> ベスト4</label>
      <button id="btnDownloadHtml" class="btn-neutral">HTMLダウンロード</button>
      <button class="theme-btn" id="btnTheme">🌙 ダーク</button>
    </div>

    <!-- 採点画面の順位表（.rank-panel-cols）と同じ横並びの配置。大会を選ぶと自動で読み直す（10 秒ごと） -->
    <div class="ranking-container rank-panel-cols" id="rankingContainer">
      <p style="color:var(--text-muted)">大会を選ぶと順位が出ます。</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="storage.js"></script>
  <script src="ranking.js"></script>
  <script>
    var body = document.body;
    var rankingContainer = document.getElementById('rankingContainer');
    var rankEventSelect = document.getElementById('rankEventSelect');
    var rankZoom = document.getElementById('rankZoom');
    var rankZoomVal = document.getElementById('rankZoomVal');

    // 順位の集計はサーバーの computeRanking が唯一の実装。この画面は描くだけ。
    var CATEGORIES = [
      { key: 'male',    title: '一般男子' },
      { key: 'female',  title: '一般女子' },
      { key: 'newFace', title: '新人枠' }
    ];

    function applyTheme(theme) {
      body.setAttribute('data-theme', theme);
      document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀ ライト' : '🌙 ダーク';
    }
    applyTheme(Storage.loadTheme());

    document.getElementById('btnTheme').addEventListener('click', function() {
      var t = Storage.loadTheme() === 'dark' ? 'light' : 'dark';
      Storage.saveTheme(t);
      applyTheme(t);
    });

    // 文字の大きさ（ユーザー要望 2026-10-05）。CSS の zoom で表ごと拡大。端末に覚える
    var ZOOM_KEY = 'tmg_ranking_zoom';
    function applyZoom(z) {
      z = Ranking.clampZoom(z);
      rankingContainer.style.zoom = String(z / 100);
      rankZoom.value = z;
      rankZoomVal.textContent = z + '%';
    }
    try { applyZoom(localStorage.getItem(ZOOM_KEY)); } catch (e) { applyZoom(100); }
    rankZoom.addEventListener('input', function() {
      applyZoom(rankZoom.value);
      try { localStorage.setItem(ZOOM_KEY, String(Ranking.clampZoom(rankZoom.value))); } catch (e) {}
    });

    // 大会一覧を読み込む。ハッシュ（#event/<id>）があればその大会、無ければ進行中の大会を自動で出す
    (async function() {
      var events = await Api.listEvents();
      if (!events) {
        alert('大会一覧を取得できませんでした。通信を確認してください。');
        return;
      }
      events.forEach(function(ev) {
        var opt = document.createElement('option');
        opt.value = ev.id;
        opt.textContent = ev.name + ' (' + ev.date + ')';
        rankEventSelect.appendChild(opt);
      });
      if (Ranking.parseHash(location.hash)) {
        applyHash();   // #event/<id> で開いたら（ダッシュボードの面）その大会
      } else {
        var cur = Ranking.pickCurrent(events);
        if (cur) selectEvent(cur.id);
      }
    })();

    // --- URL のハッシュで大会を指定して開く（設計書 2026-10-05-dashboard-design.md §3） ---
    // ダッシュボードの面として iframe で開かれるので、alert は出さず画面内の 1 行にし、
    // 10 秒ごとに読み直す（確定するたび順位が動く）。ハッシュ無しで開いたときは今までどおり
    // ボタンで 1 回読むだけ（自動更新なし）。
    var AUTO_REFRESH_MS = 10000;
    var autoTimer = null;
    var autoEventId = '';

    function showNote(text) {
      rankingContainer.innerHTML = '';
      var p = document.createElement('p');
      p.style.color = 'var(--text-muted)';
      p.textContent = text;
      rankingContainer.appendChild(p);
    }

    // 大会を読んで描く。quiet はハッシュ経由: alert の代わりに画面内の 1 行
    async function loadAndRender(eventId, quiet) {
      var data = await Api.loadRanking(eventId);
      if (!data) {
        if (quiet) showNote('順位を読み込めませんでした。' + (AUTO_REFRESH_MS / 1000) + ' 秒後にもう一度読みます。');
        else alert('順位データの読み込みに失敗しました。');
        return;
      }
      renderRankings(data);
    }

    function stopAuto() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
      autoEventId = '';
    }

    function startAuto(eventId) {
      stopAuto();
      autoEventId = eventId;
      rankEventSelect.value = eventId;
      loadAndRender(eventId, true);
      autoTimer = setInterval(function() { loadAndRender(autoEventId, true); }, AUTO_REFRESH_MS);
    }

    function applyHash() {
      var id = Ranking.parseHash(location.hash);
      if (!id) { stopAuto(); return; }
      if (id !== autoEventId) startAuto(id);
    }
    window.addEventListener('hashchange', applyHash);

    // 大会を選ぶ（セレクトの change・起動時の進行中の大会）。ハッシュも合わせ、自動更新を始める
    function selectEvent(id) {
      var hash = id ? '#event/' + encodeURIComponent(id) : '';
      if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
      if (!id) { stopAuto(); showNote('大会を選ぶと順位が出ます。'); return; }
      if (id !== autoEventId) startAuto(id);
    }
    rankEventSelect.addEventListener('change', function() { selectEvent(rankEventSelect.value); });

    // 表示の設定（内訳・ベスト4）。変えたら保存して、描き直さずに class だけ付け替える
    var optDetail = document.getElementById('rankShowDetail');
    var optBest4 = document.getElementById('rankShowBest4');
    (function() {
      var o = Ranking.loadOpts();
      optDetail.checked = o.detail;
      optBest4.checked = o.best4;
    })();
    function onOptsChange() {
      var o = { detail: optDetail.checked, best4: optBest4.checked };
      Ranking.saveOpts(o);
      Ranking.applyOpts(rankingContainer, o);
    }
    optDetail.addEventListener('change', onOptsChange);
    optBest4.addEventListener('change', onOptsChange);

    function renderRankings(data) {
      var prevRows = Ranking.captureRows(rankingContainer);   // 入れ替わりのアニメーション用に前の位置を控える
      rankingContainer.innerHTML = '';
      var ev = data.event || {};
      var finished = ev.status === 'final' || ev.status === 'archived';   // 終わった大会は全員「二巡目まで」の色
      // ダウンロードした単体HTMLだけを見てもどの大会か分かるよう、見出しを出す
      // （大会名が無ければ、意味のある見出しにならないので省略する）。
      // rank-heading クラスは HTML ダウンロード時に表本体と切り分けるための目印。
      // theme.css がダウンロード先には無いので、色は変数でなくリテラルで指定する。
      if (ev.name) {
        var heading = document.createElement('div');
        heading.className = 'rank-heading';
        heading.innerHTML = '<h2>' + Storage.esc(ev.name) + '</h2>' +
          '<p style="color:#666">' +
          Storage.esc(ev.date || '') + '　' + Storage.esc(ev.venue || '') + '</p>';
        rankingContainer.appendChild(heading);
      }
      if (heading) heading.classList.add('rank-panel-heading');
      var built = {};
      CATEGORIES.forEach(function(c) {
        var sec = buildRankTable(c.title, (data.rankings && data.rankings[c.key]) || [],
          data.progress && data.progress[c.key],
          data.best4Chance ? { remaining: data.best4Chance.remaining && data.best4Chance.remaining[c.key], rows: data.best4Chance[c.key] } : null,
          c.key, (data.detail && data.detail[c.key]) || [], finished);
        sec.classList.add('rank-panel-col');
        sec.dataset.category = c.key;
        built[c.key] = sec;
      });
      // 男子と女子を横に、新人枠は女子の下に（ユーザー要望 2026-10-06）
      if (built.male) rankingContainer.appendChild(built.male);
      var stack = document.createElement('div');
      stack.className = 'rank-panel-stack';
      stack.style.cssText = 'display:flex;flex-direction:column;gap:12px';
      if (built.female) stack.appendChild(built.female);
      if (built.newFace) stack.appendChild(built.newFace);
      rankingContainer.appendChild(stack);
      // 凡例（ベスト4 の列があるときだけ。ベスト4 を隠す設定なら凡例も消える）
      if (data.best4Chance && Array.isArray(data.best4Chance.legend)) {
        var legend = document.createElement('p');
        legend.className = 'rank-panel-legend rank-panel-legend-best4';
        legend.style.cssText = 'grid-column:1/-1;font-size:12px;color:#888;margin:4px 0 0';
        legend.textContent = 'ベスト4: ' + data.best4Chance.legend.join('　') + '　→n? はまだ斬っていない人の最大（二巡目が全部成功したときの合計）';
        rankingContainer.appendChild(legend);
      }
      // 合計の色の凡例（終わった大会では全員青なので出さない）
      if (!finished) {
        var colorLegend = document.createElement('p');
        colorLegend.className = 'rank-panel-legend rank-panel-legend-colors';
        colorLegend.style.cssText = 'grid-column:1/-1;font-size:12px;color:#888;margin:4px 0 0';
        colorLegend.textContent = Ranking.COLOR_LEGEND;
        rankingContainer.appendChild(colorLegend);
      }
      Ranking.applyOpts(rankingContainer, Ranking.loadOpts());
      Ranking.animateRows(rankingContainer, prevRows);   // 順位の入れ替わりを滑らせる（ユーザー要望 2026-10-06）
    }

    // progress（省略可）: { label } 「一巡目 12/17」= その巡目で確定した人数／全員（サーバーの roundProgress）
    // chance（省略可）: { remaining, rows: [ {flag,label,max} | null, ... ] }（rows と同じ並び。サーバーの best4Chance の部門分）。
    // あれば見出しに「残り n 名」、「ベスト4」の列（◎ ○ ✕ の記号。凡例は表の下）を出す
    // catKey（省略可）: 部門の鍵。行の data-rowkey（部門|名前）に使い、描き直しのときに同じ人の行を見つける
    // detail（省略可）: rows と同じ並びの { r1, r2, r2Done } | null（サーバーの detail）。合計の色分けと内訳「41+44」に使う
    // finished（省略可）: 大会が終わっていれば全員「二巡目まで」の色
    function buildRankTable(title, rows, progress, chance, catKey, detail, finished) {
      var div = document.createElement('div');
      div.className = 'ranking-section';
      // 見出しは採点画面の順位表と同じ部品（.rank-panel-progress）。HTML ダウンロードでは class が効かないので
      // 色だけ style でも指定する
      var sub = function(text) {
        return ' <span class="rank-panel-progress" style="font-weight:normal;font-size:13px;color:#888">' + Storage.esc(text) + '</span>';
      };
      var head = '<h3>' + Storage.esc(title) +
        (progress && progress.label ? sub(progress.label) : '') +
        (chance && typeof chance.remaining === 'number' ? sub('残り ' + chance.remaining + ' 名') : '') + '</h3>';
      var withChance = !!(chance && Array.isArray(chance.rows));
      if (rows.length === 0) {
        div.innerHTML = head + '<p class="rank-panel-none" style="color:#888">まだいません</p>';
        return div;
      }
      var trs = rows.map(function(r, i) {
        var c = withChance ? chance.rows[i] : null;
        var d = (detail && detail[i]) || null;
        // 合計の色: 未確定グレー・一巡目まで金茶・二巡目まで青（ユーザー要望 2026-10-06）。HTML ダウンロードでは class が効かないので色は style でも
        var tc = Ranking.totalClass(r.counted, d, finished);
        var tcStyle = tc === 'pending' ? 'color:#888' : (tc === 'r1' ? 'color:#8a6d1c' : 'color:#1f4fa3');
        var dt = Ranking.detailText(d);
        return '<tr data-rowkey="' + Storage.esc((catKey || title) + '|' + r.name).replace(/"/g, '&quot;') + '" data-score="' + Storage.esc(String(r.score)) + '">' +
               '<td class="rank">' + Storage.esc(String(r.rank)) + '</td><td class="name">' + Storage.esc(r.name) +
               '</td><td class="total ' + tc + '" style="' + tcStyle + '">' + Storage.esc(String(r.score)) +
               (dt ? '<span class="rank-panel-sub" style="margin-left:3px;font-size:11px;font-weight:normal;color:#888">' + Storage.esc(dt) + '</span>' : '') +
               (c && c.pending ? '<span class="rank-panel-max" style="margin-left:2px;font-size:11px;font-weight:normal;color:#888">→' + Storage.esc(String(c.max)) + '?</span>' : '') + '</td>' +
               (withChance ? '<td class="chance ' + ((c && c.flag) || '') + '" style="text-align:center;white-space:nowrap' +
                 (c && c.flag === 'sure' ? ';font-weight:bold' : (c && c.flag === 'out' ? ';color:#bbb' : ';color:#888')) + '"' +
                 (c && typeof c.max === 'number' ? ' title="最大 ' + c.max + ' 点"' : '') + '>' + Storage.esc((c && c.label) || '') + '</td>' : '') +
               '</tr>';
      }).join('');
      div.innerHTML = head +
        '<table class="rank-table rank-panel-table"><thead><tr><th class="rank">順位</th><th class="name">名前</th><th class="total">合計</th>' +
        (withChance ? '<th class="chance">ベスト4</th>' : '') + '</tr></thead><tbody>' + trs + '</tbody></table>';
      return div;
    }

    document.getElementById('btnDownloadHtml').addEventListener('click', function() {
      var sections = rankingContainer.querySelectorAll('.ranking-section');
      if (sections.length === 0) {
        alert('大会データを読み込んでから順位を表示してください。');
        return;
      }
      // 見出し（rank-heading）は表と同じ innerHTML をそのまま flex 行に入れると
      // 横に並ぶ列の1つになってしまうため、表本体（.ranking-section）とは別に
      // 取り出して flex の外に置く。
      var headingEl = rankingContainer.querySelector('.rank-heading');
      var headingHTML = headingEl ? headingEl.outerHTML : '';
      // 画面で隠している内訳・ベスト4 の列は、ダウンロードした HTML にも入れない（class は効かないので要素ごと外す）
      var opts = Ranking.loadOpts();
      var sectionsHTML = '';
      for (var i = 0; i < sections.length; i++) {
        var copy = sections[i].cloneNode(true);
        if (!opts.detail) copy.querySelectorAll('.rank-panel-sub').forEach(function(el) { el.parentNode.removeChild(el); });
        if (!opts.best4) copy.querySelectorAll('.chance').forEach(function(el) { el.parentNode.removeChild(el); });
        sectionsHTML += copy.outerHTML;
      }
      var html = '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">' +
        '<style>body{font-family:sans-serif}table{border-collapse:collapse;display:inline-table;margin:0 16px 16px 0}' +
        'th,td{border:1px solid #999;padding:6px 12px}th{background:#eee}td.total{text-align:center}h3{margin-bottom:8px}</style></head>' +
        '<body>' + headingHTML + '<div style="display:flex;flex-wrap:wrap">' +
        sectionsHTML + '</div></body></html>';
      Storage.downloadHtml('ranking.html', html);
    });
  </script>
</body>
</html>
