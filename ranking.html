<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>順位表示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <div class="page-links">
    <a href="index.html">採点</a>
    <a href="techniques.html">技術リスト編集</a>
    <strong>順位表示</strong>
  </div>

  <div class="container" style="padding-top:16px;">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
      <h2 style="margin:0;">順位表示</h2>
      <button id="btnLoadCsv" class="btn-neutral">CSVを読み込む（複数可）</button>
      <button id="btnDownloadHtml" class="btn-neutral">HTMLダウンロード</button>
      <button class="theme-btn" id="btnTheme">🌙 ダーク</button>
      <input type="file" id="rankCsvInput" accept=".csv" multiple>
    </div>

    <div class="ranking-container" id="rankingContainer">
      <p style="color:var(--text-muted)">CSVを読み込むと順位が表示されます。</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script>
    var body = document.body;
    var rankingContainer = document.getElementById('rankingContainer');
    var rankCsvInput = document.getElementById('rankCsvInput');

    function applyTheme(theme) {
      body.setAttribute('data-theme', theme);
      document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀ ライト' : '🌙 ダーク';
    }
    applyTheme(Storage.loadTheme());

    document.getElementById('btnTheme').addEventListener('click', function() {
      var t = Storage.loadTheme() === 'dark' ? 'light' : 'dark';
      Storage.saveTheme(t);
      applyTheme(t);
    });

    document.getElementById('btnLoadCsv').addEventListener('click', function() {
      rankCsvInput.click();
    });

    rankCsvInput.addEventListener('change', function(e) {
      var files = Array.prototype.slice.call(e.target.files);
      rankCsvInput.value = '';
      if (files.length === 0) return;
      var allPlayers = [];
      var loaded = 0;
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var ps = Storage.parseCsv(ev.target.result);
          Array.prototype.push.apply(allPlayers, ps);
          loaded++;
          if (loaded === files.length) renderRankings(allPlayers);
        };
        reader.readAsText(file, 'UTF-8');
      });
    });

    function renderRankings(players) {
      var maleScores = {}, femaleScores = {}, newFaceScores = {};
      players.forEach(function(p) {
        if (!p.name) return;
        var score = p.score || 0;
        if (!p.isFemale) addScore(maleScores, p.name, score);
        if (p.isFemale)  addScore(femaleScores, p.name, score);
        if (p.isNewFace) addScore(newFaceScores, p.name, score);
      });

      rankingContainer.innerHTML = '';
      rankingContainer.appendChild(buildRankTable('一般男子', maleScores));
      rankingContainer.appendChild(buildRankTable('新人', newFaceScores));
      rankingContainer.appendChild(buildRankTable('一般女子', femaleScores));
    }

    function addScore(dict, name, score) {
      dict[name] = (dict[name] || 0) + score;
    }

    function buildRankTable(title, scores) {
      var entries = Object.keys(scores).map(function(k) {
        return { name: k, score: scores[k] };
      }).sort(function(a, b) { return b.score - a.score; });

      var div = document.createElement('div');
      div.className = 'ranking-section';
      if (entries.length === 0) {
        div.innerHTML = '<h3>' + esc(title) + '</h3><p style="color:var(--text-muted)">データなし</p>';
        return div;
      }

      var rows = '';
      var rank = 1, prevScore = null;
      entries.forEach(function(e, i) {
        if (prevScore !== null && e.score !== prevScore) rank = i + 1;
        rows += '<tr><td>' + rank + '</td><td>' + esc(e.name) + '</td><td>' + esc(String(e.score)) + '</td></tr>';
        prevScore = e.score;
      });

      div.innerHTML = '<h3>' + esc(title) + '</h3>' +
        '<table class="rank-table"><tr><th>順位</th><th>選手名</th><th>得点</th></tr>' +
        rows + '</table>';
      return div;
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('btnDownloadHtml').addEventListener('click', function() {
      if (!rankingContainer.querySelector('.ranking-section')) {
        alert('CSVを読み込んでから順位を表示してください。');
        return;
      }
      var html = '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">' +
        '<style>body{font-family:sans-serif}table{border-collapse:collapse;display:inline-table;margin:0 16px 16px 0}' +
        'th,td{border:1px solid #999;padding:6px 12px}th{background:#eee}h3{margin-bottom:8px}</style></head>' +
        '<body><div style="display:flex;flex-wrap:wrap">' +
        rankingContainer.innerHTML + '</div></body></html>';
      Storage.downloadHtml('ranking.html', html);
    });
  </script>
</body>
</html>
