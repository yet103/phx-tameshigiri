<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試し斬り採点</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal { background:var(--bg-main,#fff); padding:24px; border-radius:8px; min-width:320px; }
    .modal h3 { margin-top:0; }
    .modal label { display:block; margin-bottom:12px; }
    .modal input { display:block; width:100%; padding:8px; margin-top:4px; box-sizing:border-box; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; }
    .event-bar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--bg-card,#f5f5f5); border-bottom:1px solid var(--border,#ddd); }
    .event-bar select { padding:4px 8px; }
  </style>
</head>
<body data-theme="light">

  <!-- ページナビ -->
  <div class="page-links">
    <strong>採点</strong>
    <a href="techniques.html">技術リスト編集</a>
    <a href="ranking.html">順位表示</a>
  </div>

  <!-- 大会選択バー -->
  <div class="event-bar">
    <select id="eventSelect">
      <option value="">-- 大会を選択 --</option>
    </select>
    <button id="btnNewEvent">＋ 新規大会</button>
    <button id="btnDeleteEvent">大会削除</button>
  </div>

  <!-- 大会作成モーダル -->
  <div class="modal-overlay" id="newEventModal" style="display:none">
    <div class="modal">
      <h3>新規大会作成</h3>
      <label>大会名<input type="text" id="newEventName"></label>
      <label>日付<input type="date" id="newEventDate"></label>
      <label>会場<input type="text" id="newEventVenue"></label>
      <div class="modal-actions">
        <button id="btnCreateEvent">作成</button>
        <button id="btnCancelNewEvent">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 選手ナビゲーション -->
  <div class="player-nav">
    <button class="nav-btn" id="btnPrev">◀ 前の選手</button>
    <div class="player-info">
      <span class="court-label" id="courtLabel"></span>
      <span id="playerOrderLabel"></span>
      <strong id="playerNameLabel">（大会を選択してください）</strong>
    </div>
    <button class="nav-btn" id="btnNext">次の選手 ▶</button>
  </div>

  <!-- タイマー -->
  <div class="timer-bar">
    <button id="btnTimerStart">▶ 開始</button>
    <button id="btnTimerStop">■ 停止</button>
    <button id="btnTimerReset">↺ リセット</button>
    <div class="timer-display" id="timerDisplay">05:00</div>
  </div>

  <!-- 採点テーブル -->
  <div class="score-table-wrap">
    <table class="score-table" id="scoreTable">
      <thead>
        <tr>
          <th>技</th>
          <th>初太刀</th>
          <th>二の太刀</th>
          <th>三の太刀</th>
          <th>四の太刀</th>
          <th>技術点</th>
          <th>得点</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody">
        <!-- app.jsが動的生成 -->
      </tbody>
    </table>
  </div>

  <!-- アクションバー -->
  <div class="action-bar">
    <button class="btn-success" id="btnAllSuccess">形成功</button>
    <button class="btn-fail"    id="btnAllFail">失敗</button>
    <div class="total-score" id="totalScoreDisplay">合計: 0点</div>
  </div>

  <!-- ツールバー -->
  <div class="toolbar">
    <button id="btnImport">CSVインポート</button>
    <button id="btnExport">CSVエクスポート</button>
    <button id="btnDownloadHtml">HTML保存</button>
    <button id="btnGenNext">二巡目データ生成</button>
    <button id="btnPlayerList">選手一覧</button>
    <button class="theme-btn" id="btnTheme">🌙 ダーク</button>
    <input type="file" id="csvFileInput" accept=".csv">
  </div>

  <!-- 選手一覧フローティングパネル -->
  <div class="player-list-panel" id="playerListPanel">
    <div class="player-list-header">
      <span>選手一覧</span>
      <button class="player-list-close" id="btnPlayerListClose">✕</button>
    </div>
    <div class="player-list-body">
      <table class="player-list-table" id="playerListTable">
        <thead>
          <tr>
            <th>順番</th>
            <th>選手名</th>
            <th>技1</th>
            <th>技2</th>
            <th>技3</th>
            <th>得点</th>
          </tr>
        </thead>
        <tbody id="playerListBody"></tbody>
      </table>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="scoring.js"></script>
  <script src="api.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
