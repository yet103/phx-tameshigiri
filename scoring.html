<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHX試し斬り 採点</title>
  <meta name="application-name" content="PHX試し斬り">
  <meta name="apple-mobile-web-app-title" content="PHX試し斬り">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 色（黒金の帯）は style.css の「大会トーン」節が当てる。ここはレイアウトだけ */
    /* PC・タブレットでも横幅はスマホ程度（660px）までにして左に寄せる（ユーザー要望。
       横に広げると太刀のセルや一覧が間延びして押しにくい）。狭い画面では従来どおり全幅。 */
    body { max-width: var(--page-max-width); margin: 0; }
    /* 左右の余白は全ブロック共通（--gutter）。帯（黒地）は body の幅いっぱいに敷き、中身の左右端を
       20px でそろえる。表・補正段・操作区画・選手一覧も同じ 20px の内側に置く（端がそろい、詰まりすぎない）。 */
    :root { --gutter: var(--page-gutter); }
    .page-links, .event-bar, .player-nav, .status-banner, .save-banner, .timer-bar, .court-list-head {
      padding-left: var(--gutter); padding-right: var(--gutter);
    }
    .score-table-wrap { padding-left: var(--gutter); padding-right: var(--gutter); }
    .adjust-bar { padding-left: var(--gutter); padding-right: var(--gutter); }
    .action-block { margin-left: var(--gutter); margin-right: var(--gutter); }
    .player-list-body { margin: 0 var(--gutter) 12px; }
    /* 選手一覧は 7 列（運営は掴み手を足して 8 列）を 620px に収める（余白を詰め、備考の最小幅を少し狭く）。
       収まらなければ枠の中で横スクロール。どの窓幅でも採点の下にコートごとの一覧を縦に並べる（設計書 2026-10-05 5.2。
       PC＝1100px 以上は全コート開いたまま、スマホは採点中のコートだけ開く。開閉は app.js と style.css の .court-list） */
    .player-list-table { font-size: 12px; }
    .player-list-table th, .player-list-table td { padding: 2px 4px; }
    .player-list-table th.note, .player-list-table td.note { min-width: 5em; }
    /* 順位表（一覧の下。設計書 2026-10-05 5.4）も同じ左右の余白 */
    .rank-panel-section { padding-left: var(--gutter); padding-right: var(--gutter); }
    .event-bar { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--gold); flex-wrap:wrap; }
    .event-bar select { padding:4px 8px; }
    /* 指で押す前提のタップ目標（style.css のバー類と同じ 44px） */
    .event-bar select, .event-bar button { min-height:44px; }
    /* 大会名が長くても画面幅を超えない（375px で表がはみ出していた。QA 指摘） */
    .event-bar select#eventSelect { flex: 1 1 0; min-width: 0; max-width: 100%; }
    /* ページリンクの並びのテーマ切替。リンクと同じ 13px・高さ 44px で、帯の上のボタンの色（style.css の大会トーン）に合わせる */
    .page-links .theme-btn {
      font-size: 13px; min-height: 44px; padding: 0 10px; margin-left: 0;
      background: var(--band-bg-2); color: var(--band-text); border: 1px solid var(--gold-deep); border-radius: 4px;
    }
  </style>
</head>
<body data-theme="light">

  <!-- 採点の区画（ページナビから操作区画まで）。下にコートごとの選手一覧と順位表が続く（設計書 2026-10-05） -->
  <div class="scoring-main">

  <!-- ページナビ -->
  <!-- admin-only は採点の鍵で登録した端末（採点専用モード、body.scorer-mode）では隠す（設計書 2026-10-03 6.4） -->
  <div class="page-links">
    <a href="index.html" class="admin-only">トップ</a>
    <strong>採点</strong>
    <a href="admin.html" id="linkAdmin" class="admin-only">運営</a>
    <a href="techniques.html" id="linkTechniques" class="admin-only">技得点表</a>
    <a href="ranking.html" class="admin-only">順位表示</a>
    <a href="help.html">ヘルプ</a>
    <!-- テーマ切替はページリンクの並び（ヘルプの隣）に置き、リンクと同じ文字サイズにする（ユーザー要望） -->
    <button type="button" class="theme-btn" id="btnTheme">🌙 ダーク</button>
  </div>

  <!-- 採点専用モードの札と登録の解除（role === 'scorer' のときだけ app.js が出す） -->
  <div class="scorer-bar" id="scorerBar" hidden>
    <span class="scorer-badge" id="scorerBadge"></span>
    <button type="button" class="scorer-logout" id="btnScorerLogout">この端末の登録を解除</button>
  </div>
  <!-- 初回だけのブックマークの案内（既読は localStorage） -->
  <div class="scorer-hint" id="scorerHint" hidden>
    <span>この画面を Safari（ブラウザ）でブックマークしてください。次からはそこから開けます（ホーム画面に追加するなら、この画面ではなく <a href="/join">/join</a> を）。</span>
    <button type="button" id="btnScorerHintClose">閉じる</button>
  </div>

  <!-- 大会選択バー -->
  <div class="event-bar">
    <select id="eventSelect" aria-label="大会">
      <option value="">-- 大会を選択 --</option>
    </select>
    <select id="courtSelect" aria-label="コート"></select>
    <a class="event-admin-link admin-only" id="linkEventAdmin" href="admin.html#events">大会の作成は運営画面で</a>
    <span class="save-status" id="saveStatus">● 保存済み</span>
  </div>

  <!-- 状態バナー（app.js の renderStatusBanner が中身を入れる） -->
  <div class="status-banner" id="statusBanner" hidden></div>

  <!-- 保存失敗バナー -->
  <div class="save-banner" id="saveBanner" style="display:none">
    <span id="saveBannerText">⚠ サーバーに保存できていません</span>
    <button id="btnRetrySave">今すぐ再試行</button>
  </div>

  <!-- 選手ナビゲーション -->
  <div class="player-nav">
    <!-- 部・巡目・コートを 1 行で（「男子の部　一巡目　A コート」。ユーザー要望 2026-09-30） -->
    <div class="stage-label" id="playerStageLabel"></div>
    <span class="court-label" id="courtLabel"></span>
    <div class="player-text">
      <span class="order-label" id="playerOrderLabel"></span>
      <strong id="playerNameLabel">（大会を選択してください）</strong>
      <span class="rank-label" id="playerRankLabel"></span>
    </div>
  </div>

  <!-- タイマー。選手名の帯の真下に置く（ユーザー要望 2026-09-30） -->
  <div class="timer-bar">
    <button id="btnTimerStart" title="タイマーを始める（5分から数えます）">▶ 開始</button>
    <button id="btnTimerStop" title="タイマーを止める">■ 停止</button>
    <button id="btnTimerReset" title="タイマーを 05:00 に戻す">↺ リセット</button>
    <div class="timer-display" id="timerDisplay" title="残り時間">05:00</div>
  </div>

  <!-- 採点テーブル -->
  <div class="score-table-wrap">
    <table class="score-table" id="scoreTable">
      <thead>
        <tr>
          <th>技</th>
          <th>初太刀</th>
          <th>二ノ太刀</th>
          <th>三ノ太刀</th>
          <th>四ノ太刀</th>
          <th>補正点</th>
          <th>得点</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody">
        <!-- app.jsが動的生成 -->
      </tbody>
      <!-- 全体補正点は補正点の列の真下（最終行）に置き、縦にそろえる（ユーザー要望 2026-09-30） -->
      <tfoot>
        <tr id="totalAdjustRow" class="total-adjust-row">
          <td colspan="5" class="total-adjust-label">全体補正点</td>
          <td class="adjust-col"><input type="number" step="1" min="-999" max="999" inputmode="numeric" class="adjust-input" id="totalAdjustInput"></td>
          <td class="score-col"></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- 全体補正点・備考 -->
  <div class="adjust-bar">
    <label class="note-label">備考 <input type="text" maxlength="200" id="noteInput" placeholder="（任意）"></label>
    <button type="button" id="btnNotePreset" class="btn-note-preset">文例</button>
  </div>

  <!-- 採点操作の区画: 前の選手・形成功・失敗・確定・次の選手 を一列に（右端に合計）。ユーザー要望 2026-09-30 -->
  <div class="action-block">
    <div class="action-bar">
      <button class="nav-btn" id="btnPrev" title="前の選手を開く（未確定なら確定するか聞きます）">◀ 前の選手</button>
      <button class="btn-success" id="btnAllSuccess" title="選択中の技の太刀をすべて成功にして、次の技へ">形成功</button>
      <button class="btn-fail"    id="btnAllFail" title="選択中の技の最初の「未」を失敗にして、次の技へ">失敗</button>
      <button class="btn-confirm" id="btnConfirm" title="この選手の得点を確定する（もう一度押すと取り消し）">確定</button>
      <button class="btn-confirm btn-confirm-next" id="btnConfirmNext" title="この選手の得点を確定して、そのまま次の選手を開く">確定して次へ ▶</button>
      <button class="nav-btn" id="btnNext" title="次の選手を開く（未確定なら確定するか聞きます）">次の選手 ▶</button>
      <div class="total-score" id="totalScoreDisplay"><span class="total-flag">未確定</span><span class="total-label">合計</span><span class="total-value" id="totalScoreBox"><span id="totalScoreValue">0</span><span class="total-unit">点</span></span></div>
    </div>
  </div>

  <!-- CSV エクスポート・成績表（HTML）の保存は運営画面の結果確認にある（CSV は 2026-09-30 に試合進行の ⋯ から移した）。
       大会全体を出力する運営の操作なので、コート端末（この画面）には置かない（2026-09-29 のユーザー判断） -->

  </div><!-- /.scoring-main -->

  <!-- 選手一覧（コートごとの区画。ユーザー要望 2026-10-05）。app.js の renderPlayerList が
       コートごとに「見出し＋表」（.court-list）を入れる。どの窓幅でも採点の下に縦に積む。広い窓（1100px 以上）では
       全コートを開いたまま（見出しを押しても畳まない）、狭い窓では採点中のコートだけ開く（他のコートは見出しで開閉） -->
  <section class="player-list-section" id="playerListSection" hidden>
    <div class="player-list-courts" id="playerListCourts"></div>
  </section>

  <!-- 順位表（設計書 2026-10-05 5.4）。app.js の renderRankPanel が 一般男子・新人枠・一般女子 の 3 表を入れる
       （確定した得点のある選手だけ。600px 以上で 3 列横並び、未満は縦）。大会を開いていなければ隠す -->
  <section class="rank-panel-section" id="rankPanelSection" hidden>
    <h2 class="rank-panel-title">順位<span class="rank-panel-note">確定した得点の合計（同点は同順位）</span></h2>
    <div class="rank-panel-cols" id="rankPanelCols"></div>
  </section>

  <script src="data.js"></script>
  <script src="scoring.js"></script>
  <script src="courts.js"></script>
  <script src="scope.js"></script>
  <script src="status.js"></script>
  <script src="route.js"></script>
  <script src="outbox.js"></script>
  <script src="api.js"></script>
  <script src="storage.js"></script>
  <script src="ranking.js"></script>
  <script src="app.js"></script>
</body>
</html>
